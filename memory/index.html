<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>记忆翻牌 · PlayStation web</title>
<meta name="theme-color" content="#060608">
<meta name="description" content="记忆翻牌 — PlayStation web 独立游戏页，打开即玩，成绩自动保存在本机。">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{--accent:#af52de}

:root{
  --bg:#08080a;--paper:rgba(24,25,30,.72);--ink:#f6f7fa;--ink2:rgba(255,255,255,.64);--ink3:rgba(255,255,255,.4);
  --line:rgba(255,255,255,.11);--accent:#0070d1;--accent-hi:#4da3ff;
  --shadow:0 26px 60px -26px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.06);
  --r:12px;--ease:cubic-bezier(.25,.1,.25,1);--ease2:cubic-bezier(.22,.61,.36,1)
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:#08080a;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5;overflow-x:hidden;
  opacity:0;transition:opacity 560ms var(--ease)
}
body.ready{opacity:1}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:3px;border-radius:10px}
::selection{background:rgba(0,112,193,.55);color:#fff}

/* ============ 全屏壁纸 ============ */
.gwall{position:fixed;inset:0;z-index:0;overflow:hidden;background:#07070a}
.gwall svg{position:absolute;inset:0;width:100%;height:100%;
 filter:blur(2px) brightness(.72) saturate(1.05);transform:scale(1.04);
 animation:wallIn 1400ms var(--ease2) both}
@keyframes wallIn{from{opacity:0;transform:scale(1.1)}to{opacity:1;transform:scale(1.04)}}
.gwall:after{content:"";position:absolute;inset:0;
 background:
  linear-gradient(180deg,rgba(6,6,9,.62) 0%,rgba(6,6,9,.30) 30%,rgba(6,6,9,.72) 72%,rgba(6,6,9,.96) 100%),
  radial-gradient(120% 80% at 50% 0%,transparent 30%,rgba(5,5,8,.55) 100%)}

/* ============ 顶栏 ============ */
.gtop{position:sticky;top:0;z-index:40;height:58px;display:flex;align-items:center;gap:12px;padding:0 26px;
 background:linear-gradient(180deg,rgba(6,6,9,.86),rgba(6,6,9,.42) 70%,transparent);
 backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2)}
.gback{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.72);
 background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);transition:.22s var(--ease)}
.gback:hover{background:rgba(255,255,255,.14);color:#fff}
.gback svg{width:17px;height:17px}
.gname{font-size:12.5px;font-weight:600;letter-spacing:.01em;color:rgba(255,255,255,.82)}
.gname i{font-style:normal;color:rgba(255,255,255,.36);font-weight:400;margin-left:9px;font-size:11px}
.spacer{flex:1}
.guser{display:flex;align-items:center;gap:8px;padding:3px 11px 3px 3px;border-radius:999px;
 background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:11.5px;color:rgba(255,255,255,.7)}
.guser .av{width:26px;height:26px;border-radius:50%;overflow:hidden;display:block}
.guser .av svg{width:100%;height:100%;display:block}
.gps{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;
 background:linear-gradient(140deg,#1b8ae8,#04509b);box-shadow:0 0 18px rgba(0,112,209,.45);
 transition:transform .22s var(--ease),filter .22s var(--ease)}
.gps:hover{transform:translateY(-1px);filter:brightness(1.1)}
.gps span{font-size:10px;font-weight:800;letter-spacing:.02em;line-height:1}

/* ============ 游戏信息区 ============ */
main.stage{position:relative;z-index:1}
.stage{max-width:720px;margin:0 auto;padding:10px 18px 64px}
.gstage{display:flex;flex-direction:column;justify-content:center;min-height:calc(100vh - 56px - 210px)}
.ghero{position:relative;z-index:1;display:flex;gap:20px;align-items:center;
 max-width:760px;margin:0 auto;padding:8px 18px 18px}
.ghero-cover{position:relative;width:244px;flex:0 0 auto;aspect-ratio:16/9;border-radius:8px;overflow:hidden;
 outline:1px solid rgba(255,255,255,.14);box-shadow:0 20px 44px rgba(0,0,0,.62);
 transition:transform 300ms var(--ease2),outline-color 300ms var(--ease2)}
.ghero-cover:hover{transform:translateY(-3px) scale(1.02);outline-color:rgba(255,255,255,.42)}
.gcover-in{position:absolute;inset:0;display:block}
.gcover-in svg{width:100%;height:100%;display:block}
.gcover-play{position:absolute;right:9px;bottom:9px;width:30px;height:30px;border-radius:50%;
 background:rgba(6,6,9,.55);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff;opacity:.9}
.gcover-play svg{width:14px;height:14px}
.ghero-txt{min-width:0}
.ghero-cat{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.42);font-weight:600}
.ghero-txt h1{font-size:clamp(24px,3vw,32px);font-weight:600;letter-spacing:-.03em;margin-top:6px;line-height:1.1}
.ghero-txt p{font-size:13px;color:rgba(255,255,255,.55);margin-top:7px;letter-spacing:0}
.ghero-meta{display:flex;gap:18px;margin-top:12px;font-size:11px;color:rgba(255,255,255,.44);flex-wrap:wrap}
.ghero-meta b{color:rgba(255,255,255,.88);font-weight:600}

/* 面板与游戏控件（各游戏共用） */
.stage canvas{max-width:100%;height:auto}
.panel{background:linear-gradient(160deg,rgba(26,27,33,.76),rgba(12,12,15,.84));border:1px solid rgba(255,255,255,.08);
 border-radius:12px;box-shadow:0 24px 64px -26px rgba(0,0,0,.92);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding:20px}
.hud{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.hud .cell{background:rgba(20,21,26,.72);border:1px solid var(--line);border-radius:12px;padding:7px 16px;
 text-align:center;min-width:84px;backdrop-filter:blur(14px)}
.hud .cell .k{font-size:11px;color:var(--ink3);letter-spacing:.6px}
.hud .cell .v{font-size:19px;font-weight:650;margin-top:1px;font-variant-numeric:tabular-nums;color:#fff}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.btn{border:1px solid rgba(255,255,255,.2);border-radius:999px;background:linear-gradient(180deg,#1b8ae8,#0064b4);color:#fff;
 padding:10px 22px;font-size:13.5px;font-weight:600;box-shadow:0 8px 22px -8px rgba(0,112,193,.85),inset 0 1px 0 rgba(255,255,255,.22);
 transition:transform 220ms var(--ease),box-shadow 220ms var(--ease),filter 220ms var(--ease)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.sec{background:rgba(255,255,255,.075);color:#e6edff;border-color:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.btn.sec:hover{background:rgba(255,255,255,.13);box-shadow:none}
.tips{margin-top:18px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.75}
.msg{text-align:center;font-size:13.5px;color:#cfe3ff;margin:10px 0;min-height:21px}
.overlay{position:fixed;inset:0;background:rgba(3,4,9,.78);backdrop-filter:blur(14px);
 display:flex;align-items:center;justify-content:center;z-index:60;padding:24px}
.overlay[hidden]{display:none}
.overlay .box{background:linear-gradient(155deg,rgba(30,31,37,.97),rgba(12,12,16,.98));border:1px solid rgba(255,255,255,.13);
 border-radius:18px;padding:30px 32px;text-align:center;max-width:340px;width:100%;
 box-shadow:0 30px 90px rgba(0,0,0,.78),inset 0 1px 0 rgba(255,255,255,.07)}
.overlay .box h2{font-size:23px;font-weight:650;margin-bottom:8px;letter-spacing:-.02em}
.overlay .box p{color:var(--ink2);font-size:13.5px;margin-bottom:20px}
.hidden{display:none!important}

/* ============ 底部按键提示 ============ */
.hints{position:fixed;left:0;right:0;bottom:0;z-index:36;height:50px;display:flex;align-items:center;justify-content:center;gap:28px;
 background:linear-gradient(180deg,transparent,rgba(4,4,7,.92) 46%);font-size:11px;color:rgba(255,255,255,.46);
 pointer-events:none}
.hint{display:flex;align-items:center;gap:6px}
.hint svg{width:15px;height:15px}
.hint .x{stroke:#3ba0ff}.hint .o{stroke:#e8455d}.hint .t{stroke:#37c98b}.hint .s{stroke:#c878dd}

/* ============ PS 菜单（Esc） ============ */
.psm{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:0 0 66px;
 background:rgba(3,3,6,.58);backdrop-filter:blur(22px) saturate(1.1);-webkit-backdrop-filter:blur(22px);
 opacity:0;pointer-events:none;transition:opacity 260ms var(--ease)}
.psm.on{opacity:1;pointer-events:auto}
.psm-panel{width:min(760px,93vw);background:linear-gradient(165deg,rgba(30,32,40,.97),rgba(11,12,16,.98));
 border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:20px 22px;
 box-shadow:0 34px 96px rgba(0,0,0,.84);transform:translateY(22px) scale(.99);transition:transform 320ms var(--ease2)}
.psm.on .psm-panel{transform:none}
.psm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.psm-head b{font-size:11px;font-weight:600;letter-spacing:.18em;color:rgba(255,255,255,.5);text-transform:uppercase}
.psm-head span{font-size:10.5px;color:rgba(255,255,255,.32)}
.psm-user{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;margin-bottom:14px;
 background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
.psm-user .av{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:0 0 auto}
.psm-user .av svg{width:100%;height:100%;display:block}
.psm-user div{display:flex;flex-direction:column;gap:2px;min-width:0}
.psm-user b{font-size:13px;font-weight:600}
.psm-user i{font-size:11px;font-style:normal;color:rgba(255,255,255,.42);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psm-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.psm-card{text-align:left;padding:13px 14px;border-radius:10px;background:rgba(255,255,255,.055);
 border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:4px;transition:.2s var(--ease)}
.psm-card:hover,.psm-card:focus-visible{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.26);transform:translateY(-1px)}
.psm-card b{font-size:12.5px;font-weight:600}
.psm-card i{font-size:10px;font-style:normal;color:rgba(255,255,255,.38)}
.psm-card.danger b{color:#ff8b8b}
.psm-quick{display:flex;gap:4px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07)}
.psm-q{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border-radius:8px;
 font-size:9.5px;color:rgba(255,255,255,.42);transition:.2s var(--ease)}
.psm-q:hover{background:rgba(255,255,255,.08);color:#fff}
.psm-q.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.psm-q svg{width:17px;height:17px;stroke-width:1.7;fill:none;stroke:currentColor}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:9px}
@media(max-width:820px){
  .gtop{padding:0 16px;height:54px}
  .psm-cards{grid-template-columns:repeat(2,1fr)}
  .hint span{display:none}.hints{gap:18px}
  .ghero{flex-direction:column;align-items:stretch;gap:13px;padding:6px 16px 18px}
  .ghero-cover{width:76%;align-self:flex-start}
  .ghero-txt p{display:none}
  .stage{padding-top:8px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}


.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:min(400px,92vw);margin:0 auto}
.mem .card{aspect-ratio:1;perspective:600px;cursor:pointer}
.mem .inner{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mem .card.flip .inner{transform:rotateY(180deg)}
.mem .f,.mem .bk{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;
backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:clamp(24px,7vw,38px)}
.mem .f{background:rgba(0,112,193,.14);border:1px solid rgba(77,163,255,.35);color:#dbe6ff;transform:rotateY(180deg)}
.mem .bk{background:linear-gradient(135deg,#2b3a68,#172141);border:1px solid rgba(160,190,255,.22)}
.mem .card.done .f{background:rgba(48,209,88,.16);opacity:.75}

</style>
</head>

<main class="stage gstage">
<div class="hud"><div class="cell"><div class="k">步数</div><div class="v" id="moves">0</div></div><div class="cell"><div class="k">配对</div><div class="v" id="pairs">0/8</div></div><div class="cell"><div class="k">最少步</div><div class="v" id="best">—</div></div></div>
<div class="panel"><div class="mem" id="mem"></div></div>
<div class="msg" id="msg"></div>
<div class="controls"><button class="btn" onclick="newGame()">重新洗牌</button></div>
<p class="tips">翻开两张，图案相同即配对消除。用尽量少的步数翻完全部。</p>
</main>

<div class="psm" id="psmenu">
 <div class="psm-panel">
  <div class="psm-head"><b>控制中心</b><span>Esc 关闭 · 游戏已暂停</span></div>
  <div class="psm-user"><span class="av" id="psmAvatar"></span>
    <div><b id="psmName">访客</b><i id="psmSub">正在游玩 记忆翻牌</i></div></div>
  <div class="psm-cards">
    <button class="psm-card" data-act="resume"><b>继续游戏</b><i>回到 记忆翻牌</i></button>
    <button class="psm-card" data-act="restart"><b>重新开始</b><i>从头再来一局</i></button>
    <button class="psm-card" data-act="home"><b>返回主页</b><i>回到系统主界面</i></button>
    <button class="psm-card danger" data-act="quit"><b>关闭游戏</b><i>结束本次游玩</i></button>
  </div>
  <div class="psm-quick">
    <button class="psm-q" data-act="resume"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7V5z"/></svg><span>继续</span></button>
    <button class="psm-q" data-act="restart"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 108-8M4 4v5h5"/></svg><span>重开</span></button>
    <button class="psm-q" data-act="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3v-9z"/></svg><span>主页</span></button>
    <button class="psm-q" data-act="mute" id="psmMute"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zM17 9a4 4 0 010 6"/></svg><span id="psmMuteT">静音</span></button>
    <button class="psm-q" data-act="full"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>全屏</span></button>
  </div>
 </div>
</div>
<script>

var PS_AV_SHAPES=['circle','triangle','square','cross','star','diamond','ring','wave'];
var PS_AV_COLORS=[['#3a9bec','#0a4d92'],['#b06ae0','#4a1470'],['#3fc38a','#0f5c3c'],['#ff9f45','#8a3c00'],
                  ['#ff6b8b','#8c1030'],['#3ecfcf','#0a5151'],['#e8c341','#6b4a00'],['#8b96a8','#2a3140']];
var PS_AV_PATH={
 'circle':'<circle cx="50" cy="50" r="17" fill="#fff" opacity=".92"/>',
 'triangle':'<path d="M50 30l19 34H31z" fill="#fff" opacity=".92"/>',
 'square':'<rect x="34" y="34" width="32" height="32" rx="6" fill="#fff" opacity=".92"/>',
 'cross':'<path d="M44 30h12v14h14v12H56v14H44V56H30V44h14z" fill="#fff" opacity=".92"/>',
 'star':'<path d="M50 28l7 17 18 1-14 12 5 18-16-10-16 10 5-18-14-12 18-1z" fill="#fff" opacity=".92"/>',
 'diamond':'<path d="M50 30l20 20-20 20-20-20z" fill="#fff" opacity=".92"/>',
 'ring':'<circle cx="50" cy="50" r="17" fill="none" stroke="#fff" stroke-width="7" opacity=".92"/>',
 'wave':'<path d="M30 44c7-8 14 8 21 0s14 8 21 0M30 58c7-8 14 8 21 0s14 8 21 0" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".92"/>'
};
function PS_avatarHTML(i,uid){
  i=((i|0)%8+8)%8;var sh=PS_AV_SHAPES[i],g='psav'+(uid||'')+i;
  return '<svg viewBox="0 0 100 100"><defs><linearGradient id="'+g+'" x1="0" y1="0" x2="1" y2="1">'+
    '<stop stop-color="'+PS_AV_COLORS[i][0]+'"/><stop offset="1" stop-color="'+PS_AV_COLORS[i][1]+'"/></linearGradient></defs>'+
    '<rect width="100" height="100" rx="50" fill="url(#'+g+')"/>'+PS_AV_PATH[sh]+'</svg>';
}
function PS_users(){try{var a=JSON.parse(localStorage.getItem('psweb_users')||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function PS_saveUsers(a){try{localStorage.setItem('psweb_users',JSON.stringify(a))}catch(e){}}
function PS_uid(){try{return localStorage.getItem('psweb_uid')||''}catch(e){return ''}}
function PS_setUid(id){try{localStorage.setItem('psweb_uid',id)}catch(e){}}
function PS_getUser(){
  var a=PS_users(),id=PS_uid(),u=null,i;
  if(id){for(i=0;i<a.length;i++){if(a[i].id===id)u=a[i]}}
  if(!u&&a.length)u=a[0];
  if(!u){
    try{var old=JSON.parse(localStorage.getItem('psweb_user')||'null');
      if(old){old.id='u0';PS_saveUsers([old]);PS_setUid('u0');u=old}
    }catch(e){}
  }
  return u;
}
function PS_setUser(u){
  var a=PS_users(),i,found=false;
  if(!u.id)u.id='u'+Date.now();
  for(i=0;i<a.length;i++){if(a[i].id===u.id){a[i]=u;found=true}}
  if(!found)a.push(u);
  PS_saveUsers(a);PS_setUid(u.id);
  return u;
}
function PS_clearUser(){try{localStorage.removeItem('psweb_uid')}catch(e){}}


/* ---- PS5 系统音效（Web Audio 合成，无外部素材） ---- */
var PS_SFX=(function(){
  var ctx=null,master=null,muted=false;
  try{muted=localStorage.getItem('psweb_mute')==='1'}catch(e){}
  function ac(){
    if(ctx){if(ctx.state==='suspended'){try{ctx.resume()}catch(e){}}return ctx}
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    try{ctx=new AC()}catch(e){return null}
    master=ctx.createGain();
    master.gain.value=muted?0:0.24;
    master.connect(ctx.destination);
    return ctx;
  }
  function tone(f,dur,type,vol,to,delay){
    if(muted)return;
    var c=ac();if(!c)return;
    var t=c.currentTime+(delay||0);
    var o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f,t);
    if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(master);
    o.start(t);o.stop(t+dur+0.03);
  }
  function sweep(dur,vol,f1,f2){
    if(muted)return;
    var c=ac();if(!c)return;
    var len=Math.floor(c.sampleRate*dur);
    if(len<=0)return;
    var buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    var src=c.createBufferSource();src.buffer=buf;
    var bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.1;
    var t=c.currentTime;
    bp.frequency.setValueAtTime(f1,t);
    bp.frequency.exponentialRampToValueAtTime(f2,t+dur);
    var g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+dur*0.26);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(bp);bp.connect(g);g.connect(master);
    src.start(t);src.stop(t+dur);
  }
  return {
    unlock:function(){ac()},
    tap:function(){tone(960,0.028,'sine',0.055)},
    move:function(){tone(1240,0.042,'sine',0.085)},
    hover:function(){tone(1520,0.026,'sine',0.04)},
    confirm:function(){tone(784,0.07,'sine',0.16);tone(1175,0.1,'sine',0.12,null,0.045)},
    back:function(){tone(660,0.075,'sine',0.14);tone(440,0.11,'sine',0.1,null,0.04)},
    open:function(){tone(520,0.1,'triangle',0.13,780)},
    close:function(){tone(700,0.1,'triangle',0.11,430)},
    launch:function(){sweep(0.8,0.16,320,2800);tone(110,0.75,'sine',0.2,430);tone(220,0.5,'triangle',0.08,660,0.06)},
    boot:function(){tone(92,1.5,'sine',0.2,300);tone(184,1.15,'triangle',0.075,560,0.12);sweep(1.25,0.05,180,1400)},
    trophy:function(){var n=[523,659,784,1046];for(var i=0;i<n.length;i++)tone(n[i],0.3,'sine',0.13,null,i*0.09)},
    error:function(){tone(200,0.09,'square',0.08);tone(160,0.14,'square',0.07,null,0.1)},
    /* ---- 游戏内音效 ---- */
    place:function(){tone(215,0.08,'triangle',0.13,145)},
    pop:function(){tone(1180,0.07,'sine',0.09,1620)},
    merge:function(v){var f=460+Math.min(6,Math.log(v||2)/Math.LN2)*72;tone(f,0.15,'sine',0.14,f*1.5)},
    clearLine:function(n){var b=[659,784,988,1318],k=Math.max(1,Math.min(n||1,4));
      for(var i=0;i<k;i++)tone(b[i],0.2,'sine',0.11,null,i*0.055)},
    flip:function(){sweep(0.09,0.05,1100,3000)},
    match:function(){tone(880,0.09,'sine',0.13);tone(1318,0.15,'sine',0.1,null,0.07)},
    mismatch:function(){tone(330,0.11,'sine',0.09,220)},
    eat:function(){tone(680,0.07,'square',0.06,1020)},
    mark:function(){tone(1560,0.028,'sine',0.055)},
    boom:function(){sweep(0.45,0.19,1000,80);tone(68,0.45,'sine',0.15,38)},
    shoot:function(){tone(1500,0.08,'square',0.04,400);sweep(0.06,0.026,2600,900)},
    hit:function(){tone(320,0.09,'square',0.055,120)},
    win:function(){var n=[523,659,784,1046];for(var i=0;i<n.length;i++)tone(n[i],0.32,'sine',0.12,null,i*0.085)},
    lose:function(){var n=[392,330,262,196];for(var i=0;i<n.length;i++)tone(n[i],0.26,'triangle',0.095,null,i*0.1)},
    setMuted:function(v){muted=!!v;if(master)master.gain.value=muted?0:0.24;
      try{localStorage.setItem('psweb_mute',muted?'1':'0')}catch(e){}},
    isMuted:function(){return muted}
  };
})();


/* ---- 会话：用户 / 游玩时长 / PS 菜单 ---- */
(function(){
  var SLUG=location.pathname.replace(/\/+$/,'').split('/').pop()||'index';
  var U=PS_getUser();
  var name=U&&U.name?U.name:'访客', ai=U&&U.avatar!=null?U.avatar:0;
  function paint(id){var el=document.getElementById(id);if(el)el.innerHTML=PS_avatarHTML(ai,id)}
  paint('gAvatar');paint('psmAvatar');
  var n1=document.getElementById('gUser');if(n1)n1.textContent=name;
  var n2=document.getElementById('psmName');if(n2)n2.textContent=name;

  /* 最高分回填 */
  var best=+(localStorage.getItem('gc_'+SLUG)||0);
  var gb=document.getElementById('gBest');if(gb)gb.textContent=best?best:'—';
  /* 游玩时长 */
  var tkey='psweb_time_'+SLUG;
  var spent=+(localStorage.getItem(tkey)||0);
  function fmt(s){if(s<60)return Math.round(s)+' 秒';if(s<3600)return Math.round(s/60)+' 分钟';return (s/3600).toFixed(1)+' 小时'}
  var gt=document.getElementById('gTime');if(gt)gt.textContent=spent?fmt(spent):'首次游玩';
  var t0=Date.now(),closed=false;
  function flush(){if(closed)return;closed=true;
    try{var add=(Date.now()-t0)/1000;localStorage.setItem(tkey,String(+(localStorage.getItem(tkey)||0)+add))}catch(e){}}
  window.addEventListener('beforeunload',flush);
  document.addEventListener('visibilitychange',function(){if(document.hidden)flush()});

  /* PS 菜单 */
  var psm=document.getElementById('psmenu');
  function openPS(){if(!psm)return;psm.classList.add('on');PS_SFX.open();if(window.PS_PAUSE)window.PS_PAUSE(true)}
  function closePS(){if(!psm)return;psm.classList.remove('on');PS_SFX.close();if(window.PS_PAUSE)window.PS_PAUSE(false)}
  function paused(){return psm&&psm.classList.contains('on')}
  function syncMute(){
    var m=PS_SFX.isMuted(),t=document.getElementById('psmMuteT'),b=document.getElementById('psmMute');
    if(t)t.textContent=m?'已静音':'静音';
    if(b)b.classList.toggle('on',m);
    document.body.classList.toggle('muted',m);
  }
  syncMute();
  var pb=document.getElementById('psbtn');if(pb)pb.onclick=function(){paused()?closePS():openPS()};
  if(psm){
    psm.onclick=function(e){if(e.target===psm)closePS()};
    psm.querySelectorAll('[data-act]').forEach(function(b){
      b.onclick=function(){
        var a=b.dataset.act;
        if(a==='resume')closePS();
        else if(a==='restart'){flush();location.reload()}
        else if(a==='home'){flush();location.href='../'}
        else if(a==='quit'){flush();location.href='../'}
        else if(a==='full'){if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}else{document.exitFullscreen&&document.exitFullscreen()}}
        else if(a==='mute'){PS_SFX.setMuted(!PS_SFX.isMuted());syncMute();PS_SFX.tap()}
      };
    });
  }
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      if(psm&&psm.classList.contains('on')){closePS();e.preventDefault();return}
      var ov=document.querySelector('.overlay:not([hidden])');
      if(!ov)openPS();
    }
    if(e.key==='p'||e.key==='P'){paused()?closePS():openPS()}
  },true);
  window.PS_OPEN_PS=openPS;window.PS_CLOSE_PS=closePS;
  /* 按钮轻音效 */
  document.addEventListener('click',function(e){
    var t=e.target&&e.target.closest?e.target.closest('button,.btn'):null;
    if(t)PS_SFX.tap();
  },true);
  ['pointerdown','keydown','touchstart'].forEach(function(ev){
    document.addEventListener(ev,function once(){PS_SFX.unlock();document.removeEventListener(ev,once)},false);
  });
})();
/* 进场 */
requestAnimationFrame(function(){document.body.classList.add('ready')});


function hiGet(k){try{return +(localStorage.getItem('gc_'+k)||0)}catch(e){return 0}}
function hiSet(k,v){try{localStorage.setItem('gc_'+k,v)}catch(e){}}
function setMsg(t){var m=document.getElementById('msg');if(m)m.textContent=t||''}


var ICONS=['🍎','🍊','🍋','🍇','🍉','🍒','🥝','🍑'],deck,first=null,lock=false,moves,pairs,best=hiGet('memory'),cardState=[];
function newGame(){deck=ICONS.concat(ICONS).sort(()=>Math.random()-.5);first=null;lock=false;moves=0;pairs=0;
 document.getElementById('moves').textContent=0;document.getElementById('pairs').textContent='0/8';setMsg('');
 document.getElementById('best').textContent=best||'—';initState();render()}
function render(){var m=document.getElementById('mem');m.innerHTML='';deck.forEach(function(ic,i){
 var card=document.createElement('div');card.className='card'+(cardState[i].flip?' flip':'')+(cardState[i].done?' done':'');
 card.innerHTML='<div class="inner"><div class="f">'+ic+'</div><div class="bk"></div></div>';
 card.onclick=function(){flip(i)};m.appendChild(card)})}
function initState(){cardState=deck.map(()=>({flip:false,done:false}))}
function flip(i){if(lock||cardState[i].flip||cardState[i].done)return;cardState[i].flip=true;PS_SFX.flip();render();
 if(!first){first=i;return}
 moves++;document.getElementById('moves').textContent=moves;var f=first;first=null;
 if(deck[f]===deck[i]){cardState[f].done=cardState[i].done=true;pairs++;PS_SFX.match();
  document.getElementById('pairs').textContent=pairs+'/8';setMsg('配对成功！');
  if(pairs===8){PS_SFX.win();if(!best||moves<best){best=moves;hiSet('memory',best);document.getElementById('best').textContent=best}setMsg('全部翻开！用了 '+moves+' 步')}
 }else{lock=true;PS_SFX.mismatch();setTimeout(function(){cardState[f].flip=cardState[i].flip=false;render();lock=false;setMsg('')},700)}
 render()}
newGame();

</script>
