<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>打字测试 · 课间游戏中心</title>
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{--accent:#0a84ff}

:root{--bg:#f5f5f7;--paper:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#9a9a9e;
--line:rgba(0,0,0,.09);--accent:#0a84ff;--shadow:0 18px 50px -28px rgba(0,0,0,.28);--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.8);
backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:0 18px;height:52px;display:flex;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:14px;transition:color .2s}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}
.top .name{font-weight:650;font-size:16px;letter-spacing:-.2px}
.top .spacer{flex:1}
.top .badge{font-size:11px;color:var(--ink3);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.stage{max-width:640px;margin:0 auto;padding:22px 18px 60px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.hud{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.hud .cell{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 16px;text-align:center;min-width:86px}
.hud .cell .k{font-size:11px;color:var(--ink3);letter-spacing:.4px}
.hud .cell .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{border:none;background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.sec{background:#e8e8ed;color:var(--ink)}
.tips{margin-top:16px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.7}
.msg{text-align:center;font-size:15px;color:var(--ink2);margin:10px 0;min-height:22px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;z-index:40;padding:24px}
.overlay[hidden]{display:none}
.overlay .box{background:#fff;border-radius:22px;padding:30px 34px;text-align:center;max-width:340px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.overlay .box h2{font-size:24px;margin-bottom:8px}
.overlay .box p{color:var(--ink2);font-size:14px;margin-bottom:20px}
.hidden{display:none!important}


.ty{font-size:19px;line-height:1.9;letter-spacing:.5px;color:#b0b0b6;background:#fff;border:1px solid var(--line);
border-radius:14px;padding:18px;min-height:100px}
.ty .done{color:#30d158}.ty .cur{color:var(--accent);border-bottom:2px solid var(--accent)}
.ty input{width:100%;margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;outline:none}

</style>
</head>
<body>
<header class="top"><div class="top-in">
<a class="back" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>游戏中心</a>
<span class="name">打字测试</span><span class="spacer"></span><span class="badge">文字</span>
</div></header>
<main class="stage">
<div class="hud"><div class="cell"><div class="k">速度</div><div class="v" id="wpm">0</div></div><div class="cell"><div class="k">正确率</div><div class="v" id="acc">100%</div></div><div class="cell"><div class="k">秒数</div><div class="v" id="sec">0</div></div></div>
<div class="panel"><div class="ty" id="ty"></div><input id="inp" placeholder="点击这里开始打字…" autocomplete="off" autocapitalize="off"></div>
<div class="msg" id="msg"></div>
<div class="controls"><button class="btn" onclick="start()">换一段</button></div>
<p class="tips">照着上方文字输入，自动计时。速度按每分钟词数（WPM）计算。</p>
</main>

<script>

var TEXTS=[
'the quick brown fox jumps over the lazy dog near the river bank today',
' programming is the art of telling another human what one wants the computer to do ',
'practice makes perfect so keep typing every single day to build your speed and accuracy',
'apple pc makes native mac software with swift and appkit no electron no web wrapper at all',
'the weather is beautiful today and the sun is shining brightly across the whole city'];
var text,inp,startT,timer,started=false,errors=0;
function start(){text=TEXTS[Math.random()*TEXTS.length|0];started=false;errors=0;clearInterval(timer);
 document.getElementById('sec').textContent=0;document.getElementById('wpm').textContent=0;document.getElementById('acc').textContent='100%';
 document.getElementById('inp').value='';render();setMsg('开始输入吧');document.getElementById('inp').focus()}
function render(){var v=document.getElementById('inp').value,html='';
 for(var i=0;i<text.length;i++){var cls=i<v.length?(v[i]===text[i]?'done':'err'):i===v.length?'cur':'';
  html+='<span class="'+cls+'">'+text[i]+'</span>'}
 document.getElementById('ty').innerHTML=html}
function go(){var v=document.getElementById('inp').value;
 if(!started&&v.length>0){started=true;startT=Date.now();timer=setInterval(function(){var s=Math.floor((Date.now()-startT)/1000);
  document.getElementById('sec').textContent=s;var mins=(Date.now()-startT)/60000,words=v.trim().split(/\s+/).filter(Boolean).length;
  document.getElementById('wpm').textContent=mins>0?Math.round(words/mins):0},200)}
 errors=0;for(var i=0;i<v.length;i++)if(v[i]!==text[i])errors++;
 document.getElementById('acc').textContent=v.length?Math.max(0,Math.round((1-errors/v.length)*100))+'%':'100%';render();
 if(v.length>=text.length){clearInterval(timer);var min=(Date.now()-startT)/60000,words=text.trim().split(/\s+/).length;
  document.getElementById('wpm').textContent=Math.round(words/min);setMsg('完成！正确率 '+document.getElementById('acc').textContent)}}
document.getElementById('inp').addEventListener('input',go);start();

</script>
</body>
</html>
