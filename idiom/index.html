<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>成语接龙 · 课间游戏中心</title>
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{--accent:#5856d6}

:root{--bg:#f5f5f7;--paper:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#9a9a9e;
--line:rgba(0,0,0,.09);--accent:#0a84ff;--shadow:0 18px 50px -28px rgba(0,0,0,.28);--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.8);
backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:0 18px;height:52px;display:flex;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:14px;transition:color .2s}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}
.top .name{font-weight:650;font-size:16px;letter-spacing:-.2px}
.top .spacer{flex:1}
.top .badge{font-size:11px;color:var(--ink3);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.stage{max-width:640px;margin:0 auto;padding:22px 18px 60px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.hud{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.hud .cell{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 16px;text-align:center;min-width:86px}
.hud .cell .k{font-size:11px;color:var(--ink3);letter-spacing:.4px}
.hud .cell .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{border:none;background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.sec{background:#e8e8ed;color:var(--ink)}
.tips{margin-top:16px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.7}
.msg{text-align:center;font-size:15px;color:var(--ink2);margin:10px 0;min-height:22px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;z-index:40;padding:24px}
.overlay[hidden]{display:none}
.overlay .box{background:#fff;border-radius:22px;padding:30px 34px;text-align:center;max-width:340px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.overlay .box h2{font-size:24px;margin-bottom:8px}
.overlay .box p{color:var(--ink2);font-size:14px;margin-bottom:20px}
.hidden{display:none!important}


.idm{text-align:center}
.idm .cur{font-size:30px;font-weight:700;letter-spacing:2px;margin:10px 0;color:var(--ink)}
.idm .tip{color:var(--ink3);font-size:13px}
.idm input{width:80%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:18px;text-align:center;outline:none;letter-spacing:2px}
.chain{max-height:130px;overflow:auto;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.chain span{background:#efeff4;border-radius:8px;padding:5px 10px;font-size:14px}
.chain span.me{background:#e6f0ff;color:#0a84ff}

</style>
</head>
<body>
<header class="top"><div class="top-in">
<a class="back" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>游戏中心</a>
<span class="name">成语接龙</span><span class="spacer"></span><span class="badge">文字</span>
</div></header>
<main class="stage">
<div class="hud"><div class="cell"><div class="k">回合</div><div class="v" id="rd">0</div></div><div class="cell"><div class="k">词库</div><div class="v" style="font-size:15px" id="cnt">—</div></div></div>
<div class="panel idm"><div class="tip">当前成语（请接最后一个字）</div><div class="cur" id="cur">—</div><input id="inp" placeholder="输入四字成语"><div class="chain" id="chain"></div></div>
<div class="msg" id="msg"></div>
<div class="controls"><button class="btn" onclick="start()">新一局</button><button class="btn sec" onclick="submit()">接龙</button></div>
<p class="tips">接上一个成语的最后一个字（同音即可），输入四字成语。接不上就输了。</p>
</main>

<script>

var BANK=['一心一意','意气风发','发扬光大','大显身手','手到擒来','来之不易','易如反掌','掌上明珠','珠光宝气','气象万千',
'千军万马','马到成功','功德无量','量力而行','行云流水','水到渠成','成千上万','万事如意','意犹未尽','尽心尽力',
'力争上游','游刃有余','余音绕梁','梁上君子','子虚乌有','有条不紊','紊乱无序','序齿排班','班门弄斧','斧钺之诛',
'诛心之论','论功行赏','赏心悦目','目不转睛','睛明眼亮','亮如白昼','昼伏夜出','出类拔萃','萃萃学子','子子孙孙',
'孙康映雪','雪中送炭','炭火纯青','青出于蓝','蓝田生玉','玉洁冰清','清心寡欲','欲擒故纵','纵横天下','下笔成章',
'章台杨柳','柳暗花明','明察秋毫','毫发无损','损人利己','己所不欲','欲罢不能','能屈能伸','伸张正义','义不容辞',
'辞旧迎新','新陈代谢','谢天谢地','地大物博','博古通今','今非昔比','比翼双飞','飞黄腾达','达观知命','命中注定',
'定乱扶衰','衰草寒烟','烟消云散','散兵游勇','勇往直前','前赴后继','继往开来','来日方长','长驱直入','入木三分',
'分秒必争','争先恐后','后来居上','上行下效','效死疆场','场面宏大','大器晚成','成千上万'];
// 清理无效词条并用同音映射
BANK=BANK.filter(function(x){return /^[一-龥]{4}$/.test(x)});
var HOME=window.parent;
function py(c){ // 简易同音：用常见字的首拼音字母映射，未收录则原字
 var M={'一':'y','意':'y','发':'f','大':'d','手':'s','来':'l','易':'y','掌':'z','珠':'z','气':'q','千':'q','马':'m','功':'g','量':'l',
 '行':'x','水':'s','成':'c','万':'w','事':'s','尽':'j','力':'l','游':'y','余':'y','梁':'l','子':'z','有':'y','序':'x','班':'b',
 '斧':'f','心':'x','目':'m','睛':'j','亮':'l','出':'c','萃':'c','孙':'s','雪':'x','炭':'t','青':'q','蓝':'l','玉':'y','清':'q',
 '欲':'y','纵':'z','下':'x','章':'z','柳':'l','明':'m','毫':'h','损':'s','己':'j','能':'n','伸':'s','义':'y','辞':'c','新':'x',
 '谢':'x','地':'d','博':'b','今':'j','比':'b','飞':'f','达':'d','命':'m','天':'t','精':'j','神':'s','美':'m','好':'h','学':'x','生':'s'};
 return M[c]||c}
function start(){var cur=BANK[Math.random()*BANK.length|0];document.getElementById('cur').textContent=cur;
 document.getElementById('chain').innerHTML='<span>'+cur+'</span>';document.getElementById('rd').textContent=0;
 document.getElementById('cnt').textContent=BANK.length+' 条';document.getElementById('inp').value='';setMsg('轮到你了');document.getElementById('inp').focus()}
function submit(){var v=document.getElementById('inp').value.trim();
 if(!/^[一-龥]{4}$/.test(v))return setMsg('请输入四字成语');
 var cur=document.getElementById('cur').textContent,need=py(cur[cur.length-1]);
 if(py(v[0])!==need)return setMsg('要以「'+cur[cur.length-1]+'」开头');
 if(!BANK.some(function(x){return x===v}))return setMsg('词库里没有这个成语，换个试试');
 var rd=+document.getElementById('rd').textContent+1;document.getElementById('rd').textContent=rd;
 document.getElementById('chain').insertAdjacentHTML('beforeend','<span class="me">'+v+'</span>');
 var last=v[v.length-1],cands=BANK.filter(function(x){return py(x[0])===py(last)&&x!==v});
 if(!cands.length){document.getElementById('cur').textContent='—';return setMsg('AI 接不上了，你赢了！🎉')}
 var ai=cands[Math.random()*cands.length|0];document.getElementById('chain').insertAdjacentHTML('beforeend','<span>'+ai+'</span>');
 document.getElementById('cur').textContent=ai;document.getElementById('inp').value='';setMsg('轮到你了');
 var ch=document.getElementById('chain');ch.scrollTop=ch.scrollHeight}
document.getElementById('inp').addEventListener('keydown',function(e){if(e.key==='Enter')submit()});start();

</script>
</body>
</html>
