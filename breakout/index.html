<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>打砖块 · 课间游戏中心</title>
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{--accent:#ff9f0a}

:root{--bg:#f5f5f7;--paper:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#9a9a9e;
--line:rgba(0,0,0,.09);--accent:#0a84ff;--shadow:0 18px 50px -28px rgba(0,0,0,.28);--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.8);
backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:0 18px;height:52px;display:flex;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:14px;transition:color .2s}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}
.top .name{font-weight:650;font-size:16px;letter-spacing:-.2px}
.top .spacer{flex:1}
.top .badge{font-size:11px;color:var(--ink3);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.stage{max-width:640px;margin:0 auto;padding:22px 18px 60px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.hud{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.hud .cell{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 16px;text-align:center;min-width:86px}
.hud .cell .k{font-size:11px;color:var(--ink3);letter-spacing:.4px}
.hud .cell .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{border:none;background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.sec{background:#e8e8ed;color:var(--ink)}
.tips{margin-top:16px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.7}
.msg{text-align:center;font-size:15px;color:var(--ink2);margin:10px 0;min-height:22px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;z-index:40;padding:24px}
.overlay[hidden]{display:none}
.overlay .box{background:#fff;border-radius:22px;padding:30px 34px;text-align:center;max-width:340px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.overlay .box h2{font-size:24px;margin-bottom:8px}
.overlay .box p{color:var(--ink2);font-size:14px;margin-bottom:20px}
.hidden{display:none!important}


.bo canvas{display:block;margin:0 auto;background:#1c1c1e;border-radius:12px;touch-action:none;max-width:100%}

</style>
</head>
<body>
<header class="top"><div class="top-in">
<a class="back" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>游戏中心</a>
<span class="name">打砖块</span><span class="spacer"></span><span class="badge">经典</span>
</div></header>
<main class="stage">
<div class="hud"><div class="cell"><div class="k">得分</div><div class="v" id="score">0</div></div><div class="cell"><div class="k">生命</div><div class="v" id="life">3</div></div><div class="cell"><div class="k">最高</div><div class="v" id="best">0</div></div></div>
<div class="panel bo"><canvas id="cv" width="360" height="440"></canvas></div>
<div class="msg" id="msg"></div>
<div class="controls"><button class="btn" onclick="start()">开始 / 重来</button><button class="btn sec" onclick="pause()" id="pbtn">暂停</button></div>
<p class="tips">← → 或鼠标移动挡板，接住小球打碎所有砖块。手机直接拖动。</p>
</main>
<div class="overlay" id="ov" hidden><div class="box"><h2 id="ovt">游戏结束</h2><p id="ovp"></p><button class="btn" onclick="start();document.getElementById('ov').hidden=true">再来一局</button></div></div>
<script>

var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
var pad,ball,bricks,score=0,life=3,best=hiGet('breakout'),run=false,pauseF=false,timer;
function init(){pad={x:W/2-40,w:80,h:12};ball={x:W/2,y:H-40,r:7,vx:3.2,vy:-3.6};
 bricks=[];var cols=8,rows=5,bw=(W-40)/cols,bh=20;var cs=['#ff3b30','#ff9500','#ffcc00','#34c759','#0a84ff'];
 for(var r=0;r<rows;r++)for(var c=0;c<cols;c++)bricks.push({x:20+c*bw,y:40+r*(bh+6),w:bw-4,h:bh,c:cs[r],alive:true})}
function start(){init();score=0;life=3;run=true;pauseF=false;document.getElementById('score').textContent=0;
 document.getElementById('life').textContent=3;document.getElementById('best').textContent=best;
 document.getElementById('ov').hidden=true;document.getElementById('pbtn').textContent='暂停';clearInterval(timer);timer=setInterval(step,16);setMsg('')}
function step(){if(!run||pauseF)return;ball.x+=ball.vx;ball.y+=ball.vy;
 if(ball.x<ball.r||ball.x>W-ball.r)ball.vx*=-1;if(ball.y<ball.r)ball.vy*=-1;
 if(ball.y>pad.y-5&&ball.y<H&&ball.x>pad.x-10&&ball.x<pad.x+pad.w+10&&ball.vy>0){ball.vy=-Math.abs(ball.vy);
  var hit=(ball.x-(pad.x+pad.w/2))/(pad.w/2);ball.vx=hit*4}
 if(ball.y>H+ball.r){life--;document.getElementById('life').textContent=life;
  if(life<=0){run=false;clearInterval(timer);document.getElementById('ovt').textContent='游戏结束';
   document.getElementById('ovp').textContent='得分 '+score;document.getElementById('ov').hidden=false;return}
  ball={x:W/2,y:H-40,r:7,vx:3.2,vy:-3.6}}
 bricks.forEach(function(b){if(!b.alive)return;if(ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){
  b.alive=false;ball.vy*=-1;score+=10;document.getElementById('score').textContent=score;
  if(score>best){best=score;hiSet('breakout',best);document.getElementById('best').textContent=best}}});
 if(bricks.every(function(b){return !b.alive})){run=false;clearInterval(timer);document.getElementById('ovt').textContent='通关！';
  document.getElementById('ovp').textContent='全部砖块清空，得分 '+score;document.getElementById('ov').hidden=false}
 draw()}
function draw(){ctx.fillStyle='#1c1c1e';ctx.fillRect(0,0,W,H);
 bricks.forEach(function(b){if(!b.alive)return;ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h)});
 ctx.fillStyle='#fff';ctx.fillRect(pad.x,pad.y,pad.w,pad.h);
 ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fillStyle='#fff';ctx.fill()}
function movePad(x){var r=cv.getBoundingClientRect(),px=(x-r.left)/r.width*W;pad.x=Math.max(0,Math.min(W-pad.w,px-pad.w/2))}
cv.addEventListener('mousemove',function(e){movePad(e.clientX)});
cv.addEventListener('touchmove',function(e){e.preventDefault();movePad(e.touches[0].clientX)},{passive:false});
document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')pad.x=Math.max(0,pad.x-22);if(e.key==='ArrowRight')pad.x=Math.min(W-pad.w,pad.x+22)});
function pause(){if(!run)return;pauseF=!pauseF;document.getElementById('pbtn').textContent=pauseF?'继续':'暂停'}
start();

</script>
</body>
</html>
