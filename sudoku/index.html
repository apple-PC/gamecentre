<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数独 · 课间游戏中心</title>
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{--accent:#0071e3}

:root{--bg:#f5f5f7;--paper:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#9a9a9e;
--line:rgba(0,0,0,.09);--accent:#0a84ff;--shadow:0 18px 50px -28px rgba(0,0,0,.28);--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.8);
backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:0 18px;height:52px;display:flex;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:14px;transition:color .2s}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}
.top .name{font-weight:650;font-size:16px;letter-spacing:-.2px}
.top .spacer{flex:1}
.top .badge{font-size:11px;color:var(--ink3);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.stage{max-width:640px;margin:0 auto;padding:22px 18px 60px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.hud{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.hud .cell{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 16px;text-align:center;min-width:86px}
.hud .cell .k{font-size:11px;color:var(--ink3);letter-spacing:.4px}
.hud .cell .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{border:none;background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.sec{background:#e8e8ed;color:var(--ink)}
.tips{margin-top:16px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.7}
.msg{text-align:center;font-size:15px;color:var(--ink2);margin:10px 0;min-height:22px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;z-index:40;padding:24px}
.overlay[hidden]{display:none}
.overlay .box{background:#fff;border-radius:22px;padding:30px 34px;text-align:center;max-width:340px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.overlay .box h2{font-size:24px;margin-bottom:8px}
.overlay .box p{color:var(--ink2);font-size:14px;margin-bottom:20px}
.hidden{display:none!important}


.sd{display:grid;grid-template-columns:repeat(9,1fr);width:min(450px,94vw);aspect-ratio:1;margin:0 auto;
background:#fff;border-radius:10px;overflow:hidden;border:2px solid #1d1d1f}
.sd input{width:100%;aspect-ratio:1;border:none;border-right:1px solid #d8d8dc;border-bottom:1px solid #d8d8dc;
text-align:center;font-size:clamp(15px,4.2vw,22px);font-weight:600;color:var(--accent);background:#fff;outline:none}
.sd input.fixed{color:var(--ink);background:#f2f2f5;font-weight:700}
.sd input.err{background:#ffe0e0;color:#d00}
.sd input:nth-child(9n){border-right:none}
.sd input:nth-last-child(-n+9){border-bottom:none}
.sd input.br{border-right:2px solid #1d1d1f}.sd input.bb{border-bottom:2px solid #1d1d1f}

</style>
</head>
<body>
<header class="top"><div class="top-in">
<a class="back" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>游戏中心</a>
<span class="name">数独</span><span class="spacer"></span><span class="badge">益智</span>
</div></header>
<main class="stage">
<div class="hud"><div class="cell"><div class="k">难度</div><div class="v" style="font-size:15px" id="dif">简单</div></div><div class="cell"><div class="k">时间</div><div class="v" id="time">0</div></div></div>
<div class="panel"><div class="sd" id="sd"></div></div>
<div class="msg" id="msg"></div>
<div class="controls"><button class="btn" onclick="newGame()">新题目</button><button class="btn sec" onclick="check()">检查</button><button class="btn sec" onclick="hint()">提示</button></div>
<p class="tips">每行、每列、每个 3×3 宫内填入 1–9，不重复。点击格子输入数字。</p>
</main>

<script>

var sol,grid,fixed,timer,t=0,cells=[];
function gen(){var g=Array.from({length:9},()=>Array(9).fill(0));fill(g);return g}
function fill(g){for(var i=0;i<9;i++)for(var j=0;j<9;j++)if(!g[i][j]){var nums=[1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-.5);
 for(var n of nums){if(ok(g,i,j,n)){g[i][j]=n;if(fill(g))return true;g[i][j]=0}}return false}return true}
function ok(g,i,j,n){for(var k=0;k<9;k++){if(g[i][k]===n||g[k][j]===n)return false}
 var bi=i/3|0,bj=j/3|0;for(var a=0;a<3;a++)for(var b=0;b<3;b++)if(g[bi*3+a][bj*3+b]===n)return false;return true}
function newGame(){sol=gen();grid=sol.map(r=>r.slice());fixed=grid.map(r=>r.slice());
 var remove=40;for(var k=0;k<remove;k++){var i=Math.random()*9|0,j=Math.random()*9|0;grid[i][j]=0;fixed[i][j]=0}
 t=0;clearInterval(timer);timer=setInterval(function(){t++;document.getElementById('time').textContent=t},1000);setMsg('');render()}
function render(){var sd=document.getElementById('sd');sd.innerHTML='';cells=[];
 for(var i=0;i<9;i++)for(var j=0;j<9;j++){var inp=document.createElement('input');inp.maxLength=1;inp.inputMode='numeric';
  inp.value=grid[i][j]||'';if(fixed[i][j]){inp.className='fixed';inp.readOnly=true}
  if(j===2||j===5)inp.classList.add('br');if(i===2||i===5)inp.classList.add('bb');
  (function(x,y,el){el.oninput=function(){var v=el.value.replace(/[^1-9]/g,'');el.value=v;grid[x][y]=v?+v:0;el.classList.remove('err')}})(i,j,inp);
  cells.push(inp);sd.appendChild(inp)}}
function check(){var err=0,k=0;for(var i=0;i<9;i++)for(var j=0;j<9;j++,k++){var inp=cells[k];inp.classList.remove('err');
  if(grid[i][j]&&grid[i][j]!==sol[i][j]){inp.classList.add('err');err++}}
 setMsg(err?'有 '+err+' 处错误':'目前都正确，继续！')}
function hint(){var blanks=[];for(var i=0;i<9;i++)for(var j=0;j<9;j++)if(!grid[i][j])blanks.push([i,j]);
 if(!blanks.length)return setMsg('已经填满了');var p=blanks[Math.random()*blanks.length|0];grid[p[0]][p[1]]=sol[p[0]][p[1]];render();setMsg('填了一个格子')}
newGame();

</script>
</body>
</html>
