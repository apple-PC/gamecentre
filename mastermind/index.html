<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>猜密码 · 课间游戏中心</title>
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{--accent:#ff9500}

:root{--bg:#f5f5f7;--paper:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#9a9a9e;
--line:rgba(0,0,0,.09);--accent:#0a84ff;--shadow:0 18px 50px -28px rgba(0,0,0,.28);--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.8);
backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:0 18px;height:52px;display:flex;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:14px;transition:color .2s}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}
.top .name{font-weight:650;font-size:16px;letter-spacing:-.2px}
.top .spacer{flex:1}
.top .badge{font-size:11px;color:var(--ink3);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.stage{max-width:640px;margin:0 auto;padding:22px 18px 60px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.hud{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.hud .cell{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 16px;text-align:center;min-width:86px}
.hud .cell .k{font-size:11px;color:var(--ink3);letter-spacing:.4px}
.hud .cell .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{border:none;background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.sec{background:#e8e8ed;color:var(--ink)}
.tips{margin-top:16px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.7}
.msg{text-align:center;font-size:15px;color:var(--ink2);margin:10px 0;min-height:22px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;z-index:40;padding:24px}
.overlay[hidden]{display:none}
.overlay .box{background:#fff;border-radius:22px;padding:30px 34px;text-align:center;max-width:340px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.overlay .box h2{font-size:24px;margin-bottom:8px}
.overlay .box p{color:var(--ink2);font-size:14px;margin-bottom:20px}
.hidden{display:none!important}


.mmcode{display:flex;gap:8px;justify-content:center;margin:8px 0 16px}
.pin{width:40px;height:40px;border-radius:50%;border:2px solid var(--line)}
.pick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.pick button{width:38px;height:38px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.pick button.on{border-color:var(--ink);transform:scale(1.1)}
.slots{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.slots button{width:40px;height:40px;border-radius:10px;border:1px dashed #bbb;background:#fff;font-size:20px}
.rows{max-height:220px;overflow:auto}
.mrow{display:flex;align-items:center;gap:8px;justify-content:center;padding:6px;border-bottom:1px solid var(--line-soft)}
.mrow .dots{display:flex;gap:4px}
.mrow .dots i{width:14px;height:14px;border-radius:50%;display:block}
.mrow .fb{font-size:12px;color:var(--ink2);margin-left:6px}

</style>
</head>
<body>
<header class="top"><div class="top-in">
<a class="back" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>游戏中心</a>
<span class="name">猜密码</span><span class="spacer"></span><span class="badge">推理</span>
</div></header>
<main class="stage">
<div class="hud"><div class="cell"><div class="k">剩余机会</div><div class="v" id="chance">10</div></div><div class="cell"><div class="k">位数</div><div class="v" style="font-size:15px">4 位 / 6 色</div></div></div>
<div class="panel"><p style="text-align:center;color:var(--ink2);font-size:14px">选颜色填入 4 个位置</p><div class="pick" id="pick"></div><div class="slots" id="slots"></div><div class="rows" id="rows"></div></div>
<div class="msg" id="msg"></div>
<div class="controls"><button class="btn" onclick="submit()">提交猜测</button><button class="btn sec" onclick="start()">新密码</button></div>
<p class="tips">猜出 4 位颜色排列。●=颜色位置都对，○=颜色对位置错。10 次机会。</p>
</main>

<script>

var COL=['#ff3b30','#ff9500','#ffcc00','#34c759','#0a84ff','#af52de'],code,sel=[],chance,rows=[];
function start(){code=[];for(var i=0;i<4;i++)code.push(Math.random()*6|0);sel=[0,0,0,0];chance=10;rows=[];
 document.getElementById('chance').textContent=10;document.getElementById('rows').innerHTML='';setMsg('');renderPick();renderSlots()}
function renderPick(){var p=document.getElementById('pick');p.innerHTML='';COL.forEach(function(c,i){var b=document.createElement('button');
 b.style.background=c;b.onclick=function(){fill(i)};p.appendChild(b)})}
var fillIdx=0;
function fill(c){sel[fillIdx]=c;fillIdx=(fillIdx+1)%4;renderSlots()}
function renderSlots(){var s=document.getElementById('slots');s.innerHTML='';sel.forEach(function(c,i){var b=document.createElement('button');
 b.style.background=COL[c];b.onclick=function(){fillIdx=i;fill(c)};s.appendChild(b)})}
function submit(){chance--;document.getElementById('chance').textContent=chance;
 var exact=0,near=0,ca=code.slice(),sa=sel.slice();
 for(var i=0;i<4;i++)if(sa[i]===ca[i]){exact++;sa[i]=ca[i]=-1}
 for(var i=0;i<4;i++)if(sa[i]>=0){var k=ca.indexOf(sa[i]);if(k>=0){near++;ca[k]=-1}}
 rows.push({s:sel.slice(),e:exact,n:near});renderRows();
 if(exact===4){setMsg('破解成功！🎉');return}
 if(chance<=0)setMsg('机会用完，密码是 '+code.map(function(c){return '●'}).join(''))
}
function renderRows(){var r=document.getElementById('rows');r.innerHTML='';
 rows.forEach(function(row){var d=document.createElement('div');d.className='mrow';
 var dots='';row.s.forEach(function(c){dots+='<i style="background:'+COL[c]+'"></i>'});
 var fb='●'.repeat(row.e)+'○'.repeat(row.n);
 d.innerHTML='<div class="dots">'+dots+'</div><span class="fb">'+fb+'</span>';r.appendChild(d)});r.scrollTop=r.scrollHeight}
start();

</script>
</body>
</html>
