<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>井字棋 · 课间游戏中心</title>
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{--accent:#ff3b30}

:root{--bg:#f5f5f7;--paper:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#9a9a9e;
--line:rgba(0,0,0,.09);--accent:#0a84ff;--shadow:0 18px 50px -28px rgba(0,0,0,.28);--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.8);
backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:0 18px;height:52px;display:flex;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:14px;transition:color .2s}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}
.top .name{font-weight:650;font-size:16px;letter-spacing:-.2px}
.top .spacer{flex:1}
.top .badge{font-size:11px;color:var(--ink3);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.stage{max-width:640px;margin:0 auto;padding:22px 18px 60px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.hud{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.hud .cell{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 16px;text-align:center;min-width:86px}
.hud .cell .k{font-size:11px;color:var(--ink3);letter-spacing:.4px}
.hud .cell .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{border:none;background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.sec{background:#e8e8ed;color:var(--ink)}
.tips{margin-top:16px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.7}
.msg{text-align:center;font-size:15px;color:var(--ink2);margin:10px 0;min-height:22px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;z-index:40;padding:24px}
.overlay[hidden]{display:none}
.overlay .box{background:#fff;border-radius:22px;padding:30px 34px;text-align:center;max-width:340px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.overlay .box h2{font-size:24px;margin-bottom:8px}
.overlay .box p{color:var(--ink2);font-size:14px;margin-bottom:20px}
.hidden{display:none!important}


.tt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(330px,90vw);margin:0 auto}
.tt button{aspect-ratio:1;background:#fff;border:1px solid var(--line);border-radius:14px;font-size:clamp(38px,11vw,54px);
font-weight:700;color:var(--ink);transition:background .15s,transform .1s}
.tt button:hover{background:#f5f5f7}
.tt button:active{transform:scale(.95)}
.tt button.x{color:#0a84ff}.tt button.o{color:#ff3b30}
.score{display:flex;justify-content:center;gap:24px;margin:4px 0 18px;color:var(--ink2);font-size:14px}
.score b{color:var(--ink);font-size:18px}

</style>
</head>
<body>
<header class="top"><div class="top-in">
<a class="back" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>游戏中心</a>
<span class="name">井字棋</span><span class="spacer"></span><span class="badge">对战</span>
</div></header>
<main class="stage">
<div class="score"><span>你 <b id="sw">0</b></span><span>平 <b id="sd">0</b></span><span>AI <b id="sl">0</b></span></div>
<div class="panel"><div class="tt" id="tt"></div></div>
<div class="msg" id="msg"></div>
<div class="controls"><button class="btn" onclick="newRound()">重开一局</button><button class="btn sec" onclick="resetScore()">清空比分</button></div>
<p class="tips">你执 X 先手，AI 执 O。三步连成一线即胜。AI 会尽力拦你，但并非无敌。</p>
</main>

<script>

var b,w=0,d=0,l=0,yourTurn=true,over=false;
function render(){var tt=document.getElementById('tt');tt.innerHTML='';
 for(var i=0;i<9;i++){var btn=document.createElement('button');btn.textContent=b[i]||'';
  if(b[i]==='X')btn.className='x';if(b[i]==='O')btn.className='o';
  (function(k){btn.onclick=function(){play(k)}})(i);tt.appendChild(btn)}}
function win(p){var L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 return L.some(function(l){return l.every(function(i){return b[i]===p})})}
function full(){return b.every(function(x){return x})}
function finish(res){over=true;if(res==='X'){w++;setMsg('你赢了！')}else if(res==='O'){l++;setMsg('AI 赢了')}else{d++;setMsg('平局')}
 document.getElementById('sw').textContent=w;document.getElementById('sl').textContent=l;document.getElementById('sd').textContent=d}
function play(i){if(over||!yourTurn||b[i])return;b[i]='X';render();
 if(win('X'))return finish('X');if(full())return finish('D');yourTurn=false;setTimeout(ai,260)}
function ai(){var best=2,move=-1;
 for(var i=0;i<9;i++){if(b[i])continue;b[i]='O';var s=mm(false,0);b[i]='';if(s<best){best=s;move=i}}
 if(move>=0)b[move]='O';render();
 if(win('O'))return finish('O');if(full())return finish('D');yourTurn=true;setMsg('轮到你了')}
function mm(ismax,dep){var r=win('O')?-1:win('X')?1:full()?0:null;if(r!==null)return r;
 var best=ismax?-2:2;for(var i=0;i<9;i++){if(b[i])continue;b[i]=ismax?'X':'O';var s=mm(!ismax,dep+1);b[i]='';
  best=ismax?Math.max(best,s):Math.min(best,s)}return best}
function newRound(){b=Array(9).fill('');over=false;yourTurn=true;setMsg('你先手');render()}
function resetScore(){w=d=l=0;document.getElementById('sw').textContent=0;document.getElementById('sd').textContent=0;document.getElementById('sl').textContent=0}
newRound();

</script>
</body>
</html>
