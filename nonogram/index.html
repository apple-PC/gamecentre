<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数织 · 课间游戏中心</title>
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{--accent:#5856d6}

:root{--bg:#f5f5f7;--paper:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#9a9a9e;
--line:rgba(0,0,0,.09);--accent:#0a84ff;--shadow:0 18px 50px -28px rgba(0,0,0,.28);--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.8);
backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:0 18px;height:52px;display:flex;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:14px;transition:color .2s}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}
.top .name{font-weight:650;font-size:16px;letter-spacing:-.2px}
.top .spacer{flex:1}
.top .badge{font-size:11px;color:var(--ink3);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.stage{max-width:640px;margin:0 auto;padding:22px 18px 60px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.hud{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.hud .cell{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 16px;text-align:center;min-width:86px}
.hud .cell .k{font-size:11px;color:var(--ink3);letter-spacing:.4px}
.hud .cell .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{border:none;background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.sec{background:#e8e8ed;color:var(--ink)}
.tips{margin-top:16px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.7}
.msg{text-align:center;font-size:15px;color:var(--ink2);margin:10px 0;min-height:22px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;z-index:40;padding:24px}
.overlay[hidden]{display:none}
.overlay .box{background:#fff;border-radius:22px;padding:30px 34px;text-align:center;max-width:340px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.overlay .box h2{font-size:24px;margin-bottom:8px}
.overlay .box p{color:var(--ink2);font-size:14px;margin-bottom:20px}
.hidden{display:none!important}


.ng{display:grid;gap:2px;width:max-content;margin:0 auto;background:#fff;padding:10px;border-radius:12px}
.ng .hdr{display:flex;align-items:flex-end;justify-content:center;font-size:11px;color:var(--ink2);font-weight:600;line-height:1.1}
.ng .cell{width:30px;height:30px;border:1px solid #dcdce0;border-radius:4px;background:#fff;transition:background .1s}
.ng .cell.on{background:#5856d6}.ng .cell.x:after{content:"×";color:#c0c0c6;display:block;text-align:center;line-height:28px;font-size:16px}
@media(max-width:420px){.ng .cell{width:24px;height:24px}.ng .cell.x:after{line-height:22px}}

</style>
</head>
<body>
<header class="top"><div class="top-in">
<a class="back" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>游戏中心</a>
<span class="name">数织</span><span class="spacer"></span><span class="badge">解谜</span>
</div></header>
<main class="stage">
<div class="hud"><div class="cell"><div class="k">格子</div><div class="v" style="font-size:15px" id="prog">0/0</div></div></div>
<div class="panel"><div class="ng" id="ng"></div><p style="text-align:center;color:var(--ink3);font-size:12px;margin-top:12px">左键填色 · 右键打叉</p></div>
<div class="msg" id="msg"></div>
<div class="controls"><button class="btn" onclick="start()">新图案</button><button class="btn sec" onclick="check()">检查</button></div>
<p class="tips">根据行列旁的数字填色。数字表示连续填色块的长度，多段之间至少隔一格。填出隐藏图案。</p>
</main>

<script>

var N=5,SOL,bd,right=false;
function gen(){var g=Array.from({length:N},()=>Array(N).fill(0));
 // 随机生成一个左右/上下对称的小图案
 for(var i=0;i<N;i++)for(var j=0;j<N/2;j++)if(Math.random()<.5){g[i][j]=g[i][N-1-j]=1}return g}
function clues(line){var res=[],c=0;for(var v of line){if(v)c++;else if(c){res.push(c);c=0}}if(c)res.push(c);return res.length?res.join(' '):'0'}
function start(){SOL=gen();bd=Array.from({length:N},()=>Array(N).fill(0));document.getElementById('ov')&&(document.getElementById('ov').hidden=true);render();setMsg('');updateProg()}
function render(){var ng=document.getElementById('ng');ng.innerHTML='';
 // 顶部行提示区
 var corner=document.createElement('div');corner.style.gridColumn='1';corner.style.gridRow='1';ng.appendChild(corner);
 for(var j=0;j<N;j++){var h=document.createElement('div');h.className='hdr';h.style.gridColumn=String(j+2);h.style.gridRow='1';
  var col=[];for(var i=0;i<N;i++)col.push(SOL[i][j]);h.innerHTML=clues(col).replace(/ /g,'<br>');ng.appendChild(h)}
 for(var i=0;i<N;i++){
  var rh=document.createElement('div');rh.className='hdr';rh.style.gridColumn='1';rh.style.gridRow=String(i+2);
  rh.style.justifyContent='flex-end';rh.style.paddingRight='6px';rh.innerHTML=clues(SOL[i]).replace(/ /g,' ');ng.appendChild(rh);
  for(var j=0;j<N;j++){var c=document.createElement('div');c.className='cell'+(bd[i][j]===1?' on':bd[i][j]===2?' x':'');
   c.style.gridColumn=String(j+2);c.style.gridRow=String(i+2);
   (function(x,y){c.onmousedown=function(e){e.preventDefault();bd[x][y]=e.button===2?2:(bd[x][y]===1?0:1);render();updateProg()};
    c.oncontextmenu=function(e){e.preventDefault()}})(i,j);ng.appendChild(c)}}
 ng.style.gridTemplateColumns='60px repeat('+N+',30px)';if(window.innerWidth<420)ng.style.gridTemplateColumns='40px repeat('+N+',24px)'}
function updateProg(){var filled=0,total=0;for(var i=0;i<N;i++)for(var j=0;j<N;j++)if(SOL[i][j])total++;else if(bd[i][j]===1)filled++;
 document.getElementById('prog').textContent=filled+'/'+total}
function check(){var good=true;for(var i=0;i<N;i++)for(var j=0;j<N;j++){var want=SOL[i][j]?1:0,got=bd[i][j]===1?1:0;if(want!==got)good=false}
 setMsg(good?'完全正确，图案出现了！':'还有不对的地方，再想想')}
start();

</script>
</body>
</html>
