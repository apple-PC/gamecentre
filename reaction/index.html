<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>抢按钮 · 课间游戏中心</title>
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{--accent:#ff3b30}

:root{--bg:#f5f5f7;--paper:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#9a9a9e;
--line:rgba(0,0,0,.09);--accent:#0a84ff;--shadow:0 18px 50px -28px rgba(0,0,0,.28);--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.8);
backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:0 18px;height:52px;display:flex;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:14px;transition:color .2s}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}
.top .name{font-weight:650;font-size:16px;letter-spacing:-.2px}
.top .spacer{flex:1}
.top .badge{font-size:11px;color:var(--ink3);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.stage{max-width:640px;margin:0 auto;padding:22px 18px 60px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.hud{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.hud .cell{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 16px;text-align:center;min-width:86px}
.hud .cell .k{font-size:11px;color:var(--ink3);letter-spacing:.4px}
.hud .cell .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{border:none;background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.sec{background:#e8e8ed;color:var(--ink)}
.tips{margin-top:16px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.7}
.msg{text-align:center;font-size:15px;color:var(--ink2);margin:10px 0;min-height:22px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;z-index:40;padding:24px}
.overlay[hidden]{display:none}
.overlay .box{background:#fff;border-radius:22px;padding:30px 34px;text-align:center;max-width:340px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.overlay .box h2{font-size:24px;margin-bottom:8px}
.overlay .box p{color:var(--ink2);font-size:14px;margin-bottom:20px}
.hidden{display:none!important}


.rzone{height:240px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex-direction:column;
color:#fff;font-size:22px;font-weight:700;transition:background .1s;background:#8e8e93;user-select:none;text-align:center;padding:20px}
.rzone.wait{background:#636366}.rzone.go{background:#34c759}.rzone.false{background:#ff3b30}
.rzone .sub{font-size:14px;font-weight:500;opacity:.9;margin-top:8px}
.pl{display:flex;gap:12px;margin-top:16px}
.pl button{flex:1;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:700;color:#fff;transition:transform .08s}
.pl button:active{transform:scale(.96)}
.pl .a{background:#0a84ff}.pl .b{background:#ff9f0a}
.pl .p1{color:#0a84ff}.pl .p2{color:#ff9f0a}

</style>
</head>
<body>
<header class="top"><div class="top-in">
<a class="back" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>游戏中心</a>
<span class="name">抢按钮</span><span class="spacer"></span><span class="badge">对决</span>
</div></header>
<main class="stage">
<div class="hud"><div class="cell"><div class="k">玩家1</div><div class="v p1" id="s1">0</div></div><div class="cell"><div class="k">玩家2</div><div class="v p2" id="s2">0</div></div><div class="cell"><div class="k">回合</div><div class="v" id="rd">0</div></div></div>
<div class="panel"><div class="rzone" id="zone">准备好了吗？<div class="sub">两人各按各的键，屏幕变绿立刻抢</div></div><div class="pl"><button class="a" id="ba" onmousedown="hit(1)" ontouchstart="hit(1)">玩家1 抢（A）</button><button class="b" id="bb" onmousedown="hit(2)" ontouchstart="hit(2)">玩家2 抢（L）</button></div></div>
<div class="msg" id="msg"></div>
<div class="controls"><button class="btn" onclick="start()">开始回合</button><button class="btn sec" onclick="reset()">清空比分</button></div>
<p class="tips">屏幕变绿后立刻抢按。谁先按谁得分；抢跑（还没变绿就按）扣分。键盘 A / L 对应两人。</p>
</main>

<script>

var phase='idle',s1=0,s2=0,rd=0,timer,startT;
function setZone(cls,html){var z=document.getElementById('zone');z.className='rzone '+cls;z.innerHTML=html}
function start(){if(phase==='countdown'||phase==='go')return;phase='countdown';rd++;document.getElementById('rd').textContent=rd;
 setZone('wait','准备…<div class="sub">别抢跑！</div>');clearTimeout(timer);
 timer=setTimeout(function(){phase='go';startT=performance.now();setZone('go','抢！<div class="sub">现在！</div>')},1200+Math.random()*3000)}
function hit(p){if(phase==='go'){phase='done';var ms=Math.round(performance.now()-startT);
 if(p===1)s1++;else s2++;update();setZone(p===1?'go':'go',(p===1?'玩家1':'玩家2')+' 抢到了！<div class="sub">'+ms+' 毫秒</div>')}
 else if(phase==='countdown'){phase='done';if(p===1)s1=Math.max(0,s1-1);else s2=Math.max(0,s2-1);update();
 setZone('false','抢跑！<div class="sub">'+(p===1?'玩家1':'玩家2')+' 扣一分</div>')}}
function update(){document.getElementById('s1').textContent=s1;document.getElementById('s2').textContent=s2}
function reset(){s1=s2=rd=0;update();document.getElementById('rd').textContent=0;phase='idle';setZone('','准备好了吗？<div class="sub">点开始回合</div>')}
document.addEventListener('keydown',function(e){if(e.key==='a'||e.key==='A')hit(1);if(e.key==='l'||e.key==='L')hit(2)});

</script>
</body>
</html>
