<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>五子棋 · 课间游戏中心</title>
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{--accent:#ff9500}

:root{--bg:#f5f5f7;--paper:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#9a9a9e;
--line:rgba(0,0,0,.09);--accent:#0a84ff;--shadow:0 18px 50px -28px rgba(0,0,0,.28);--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.8);
backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:0 18px;height:52px;display:flex;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:14px;transition:color .2s}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}
.top .name{font-weight:650;font-size:16px;letter-spacing:-.2px}
.top .spacer{flex:1}
.top .badge{font-size:11px;color:var(--ink3);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.stage{max-width:640px;margin:0 auto;padding:22px 18px 60px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.hud{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.hud .cell{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 16px;text-align:center;min-width:86px}
.hud .cell .k{font-size:11px;color:var(--ink3);letter-spacing:.4px}
.hud .cell .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{border:none;background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.sec{background:#e8e8ed;color:var(--ink)}
.tips{margin-top:16px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.7}
.msg{text-align:center;font-size:15px;color:var(--ink2);margin:10px 0;min-height:22px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;z-index:40;padding:24px}
.overlay[hidden]{display:none}
.overlay .box{background:#fff;border-radius:22px;padding:30px 34px;text-align:center;max-width:340px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.overlay .box h2{font-size:24px;margin-bottom:8px}
.overlay .box p{color:var(--ink2);font-size:14px;margin-bottom:20px}
.hidden{display:none!important}


.gm{background:#e8c98f;border-radius:12px;position:relative;width:min(390px,92vw);aspect-ratio:1;margin:0 auto;
box-shadow:inset 0 0 30px rgba(0,0,0,.1)}
.gm canvas{width:100%;height:100%;display:block;cursor:crosshair}

</style>
</head>
<body>
<header class="top"><div class="top-in">
<a class="back" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>游戏中心</a>
<span class="name">五子棋</span><span class="spacer"></span><span class="badge">对战</span>
</div></header>
<main class="stage">
<div class="hud"><div class="cell"><div class="k">对手</div><div class="v" style="font-size:15px">电脑 AI</div></div><div class="cell"><div class="k">你执</div><div class="v" style="font-size:15px">黑 ●</div></div></div>
<div class="panel"><div class="gm"><canvas id="cv" width="390" height="390"></canvas></div></div>
<div class="msg" id="msg"></div>
<div class="controls"><button class="btn" onclick="start()">重新开局</button></div>
<p class="tips">点击交叉点落子，先连成五子者胜。你执黑先手，AI 执白。</p>
</main>
<div class="overlay" id="ov" hidden><div class="box"><h2 id="ovt"></h2><p id="ovp"></p><button class="btn" onclick="start();document.getElementById('ov').hidden=true">再来一局</button></div></div>
<script>

var N=13,cv=document.getElementById('cv'),ctx=cv.getContext('2d'),cell=cv.width/(N+1),b,turn,over;
function start(){b=Array.from({length:N},()=>Array(N).fill(0));turn=1;over=false;document.getElementById('ov').hidden=true;setMsg('你先手');draw()}
function draw(){ctx.fillStyle='#e8c98f';ctx.fillRect(0,0,cv.width,cv.height);
 ctx.strokeStyle='#7a5a2e';ctx.lineWidth=1;for(var i=0;i<N;i++){ctx.beginPath();ctx.moveTo(cell,(i+1)*cell);ctx.lineTo(N*cell,(i+1)*cell);ctx.stroke();
 ctx.beginPath();ctx.moveTo((i+1)*cell,cell);ctx.lineTo((i+1)*cell,N*cell);ctx.stroke()}
 for(var i=0;i<N;i++)for(var j=0;j<N;j++)if(b[i][j]){var x=(j+1)*cell,y=(i+1)*cell;
 ctx.beginPath();ctx.arc(x,y,cell*.42,0,7);ctx.fillStyle=b[i][j]===1?'#1a1a1a':'#fff';ctx.fill();
 ctx.strokeStyle='rgba(0,0,0,.3)';ctx.stroke()}}
function place(i,j,p){b[i][j]=p;draw();if(check(i,j,p)){over=true;document.getElementById('ovt').textContent=p===1?'你赢了！':'AI 赢了';
 document.getElementById('ovp').textContent='五子连珠';document.getElementById('ov').hidden=false;return true}return false}
function check(i,j,p){var D=[[0,1],[1,0],[1,1],[1,-1]];return D.some(function(d){var c=1;
 for(var s=-1;s<=1;s+=2){var x=i+d[0]*s,y=j+d[1]*s;while(x>=0&&x<N&&y>=0&&y<N&&b[x][y]===p){c++;x+=d[0]*s;y+=d[1]*s}}
 return c>=5})}
cv.onclick=function(e){if(over||turn!==1)return;var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*cv.width,y=(e.clientY-r.top)/r.height*cv.height;
 var j=Math.round(x/cell)-1,i=Math.round(y/cell)-1;if(i<0||i>=N||j<0||j>=N||b[i][j])return;
 if(place(i,j,1))return;turn=2;setMsg('AI 思考中…');setTimeout(ai,300)};
function ai(){var best=-1,bi=-1,bj=-1;
 for(var i=0;i<N;i++)for(var j=0;j<N;j++){if(b[i][j])continue;var s=score(i,j,2)+score(i,j,1)*.9;
  if(s>best){best=s;bi=i;bj=j}}
 if(bi>=0){if(!place(bi,bj,2))turn=1;setMsg('轮到你了')}}
function score(i,j,p){var total=0,D=[[0,1],[1,0],[1,1],[1,-1]];
 D.forEach(function(d){var c=0,open=0;
  for(var s=-1;s<=1;s+=2){var x=i+d[0]*s,y=j+d[1]*s,k=0;while(x>=0&&x<N&&y>=0&&y<N&&b[x][y]===p){k++;x+=d[0]*s;y+=d[1]*s}
   c+=k;if(x>=0&&x<N&&y>=0&&y<N&&!b[x][y])open++}
  if(c>0)total+=Math.pow(10,c)+open*c});return total}
start();

</script>
</body>
</html>
