<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2048 · PlayStation web</title>
<meta name="theme-color" content="#0a0e1a">
<meta name="description" content="2048 — PlayStation web 游戏库，打开即玩，成绩自动保存在本机。">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{--accent:#f59e0b}

:root{
  --bg:#0a0e1a;--paper:rgba(22,30,54,.76);--ink:#f4f7ff;--ink2:#aebbd4;--ink3:#7886a3;
  --line:rgba(160,190,255,.14);--accent:#0070d1;--accent-hi:#4da3ff;
  --shadow:0 26px 60px -26px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.06);
  --r:20px;--ease:cubic-bezier(.25,.1,.25,1)
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:radial-gradient(1100px 620px at 10% -12%,rgba(10,95,192,.32),transparent 62%),
    radial-gradient(900px 600px at 94% 4%,rgba(75,42,158,.26),transparent 60%),
    radial-gradient(820px 520px at 50% 110%,rgba(6,61,134,.20),transparent 66%),
    linear-gradient(180deg,#0d1428 0%,#070a14 66%,#060811 100%);
  background-attachment:fixed;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5;overflow-x:hidden
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:3px;border-radius:10px}
::selection{background:rgba(0,112,193,.55);color:#fff}
/* 系统状态栏 */
.sysbar{height:30px;padding:0 26px;display:flex;align-items:center;gap:11px;font-size:10.5px;
 letter-spacing:.9px;color:var(--ink2);background:rgba(4,7,16,.6);border-bottom:1px solid rgba(0,112,193,.14)}
.sysbar .ps{display:flex;align-items:center;gap:7px;font-weight:700;color:#e8f0ff}
.sysbar .ps svg{width:16px;height:16px}
.sysbar .sp{flex:1}
.sysbar .clock{font-variant-numeric:tabular-nums;color:#dbe6ff;letter-spacing:.5px}
.sysbar .me{display:flex;align-items:center;gap:6px;color:#e8f0ff}
.sysbar .me .dot{width:7px;height:7px;border-radius:50%;background:#4da3ff;box-shadow:0 0 9px #4da3ff}
.sysbar .ava{width:19px;height:19px;border-radius:50%;background:linear-gradient(135deg,#1684de,#004b94);display:grid;place-items:center;font-size:9px;font-weight:700}
.sysbar .ic{width:13px;height:13px;opacity:.8}
/* 顶栏 */
.top{position:sticky;top:0;z-index:30;height:62px;display:flex;align-items:center;gap:10px;padding:0 24px;
 background:rgba(11,16,32,.72);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);
 border-bottom:1px solid rgba(77,163,255,.16)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(77,163,255,.45),transparent)}
.top .home{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);background:rgba(255,255,255,.05);transition:all 220ms var(--ease)}
.top .home:hover{color:#fff;background:rgba(0,112,193,.24)}
.top .home svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:12.5px;
 border:1px solid rgba(160,190,255,.16);border-radius:999px;padding:6px 13px;background:rgba(255,255,255,.035);
 transition:all 220ms var(--ease)}
.back:hover{color:#fff;border-color:rgba(77,163,255,.55);background:rgba(0,112,193,.18)}
.back svg{width:15px;height:15px}
.top .name{font-weight:600;font-size:15px;letter-spacing:.2px}
.top .spacer{flex:1}
.top .badge{font-size:10.5px;color:#bcd6ff;border:1px solid rgba(0,112,193,.4);background:rgba(0,112,193,.14);padding:4px 11px;border-radius:999px}
.top .psbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
 background:linear-gradient(135deg,#1684de,#004b94);color:#fff;box-shadow:0 0 20px rgba(0,112,193,.5)}
.top .psbtn svg{width:17px;height:17px;fill:#fff}
/* 舞台与玻璃面板 */
.stage{max-width:680px;margin:0 auto;padding:26px 18px 110px}
.panel{background:linear-gradient(155deg,rgba(30,41,72,.78),rgba(14,20,38,.76));border:1px solid var(--line);
 border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:20px}
.hud{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.hud .cell{background:rgba(14,20,38,.64);border:1px solid var(--line);border-radius:14px;padding:8px 16px;text-align:center;min-width:86px;backdrop-filter:blur(12px)}
.hud .cell .k{font-size:11px;color:var(--ink3);letter-spacing:.6px}
.hud .cell .v{font-size:20px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 18px rgba(77,163,255,.28)}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.btn{border:1px solid rgba(255,255,255,.2);border-radius:999px;background:linear-gradient(180deg,#1684de,#0064b4);color:#fff;
 padding:11px 22px;font-size:14px;font-weight:600;box-shadow:0 8px 22px -8px rgba(0,112,193,.85),inset 0 1px 0 rgba(255,255,255,.22);
 transition:transform 220ms var(--ease),box-shadow 220ms var(--ease),filter 220ms var(--ease)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.sec{background:rgba(255,255,255,.075);color:#e6edff;border-color:rgba(160,190,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.btn.sec:hover{background:rgba(255,255,255,.13);box-shadow:none}
.tips{margin-top:18px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.75}
.msg{text-align:center;font-size:14px;color:#bcd6ff;margin:10px 0;min-height:22px}
.overlay{position:fixed;inset:0;background:rgba(3,5,12,.76);backdrop-filter:blur(12px);
 display:flex;align-items:center;justify-content:center;z-index:60;padding:24px}
.overlay[hidden]{display:none}
.overlay .box{background:linear-gradient(155deg,rgba(32,44,78,.96),rgba(14,20,38,.96));border:1px solid rgba(77,163,255,.32);
 border-radius:22px;padding:32px 34px;text-align:center;max-width:340px;width:100%;box-shadow:0 30px 90px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.08)}
.overlay .box h2{font-size:24px;font-weight:650;margin-bottom:8px}
.overlay .box p{color:var(--ink2);font-size:14px;margin-bottom:22px}
.hidden{display:none!important}
/* PS5 手柄按键提示条 */
.hints{position:fixed;left:0;right:0;bottom:0;z-index:35;height:54px;display:flex;align-items:center;justify-content:center;gap:30px;
 background:linear-gradient(180deg,transparent,rgba(4,7,16,.92) 42%);font-size:11.5px;color:var(--ink2)}
.hint{display:flex;align-items:center;gap:7px}
.hint svg{width:17px;height:17px}
.hint .x{stroke:#2f9bff}.hint .o{stroke:#e8455d}.hint .t{stroke:#37c98b}.hint .s{stroke:#c878dd}
/* 控制中心 */
.cc{position:fixed;inset:0;z-index:70;background:rgba(3,5,12,.6);backdrop-filter:blur(16px);
 display:none;align-items:flex-end;justify-content:center;padding:0 0 64px}
.cc.on{display:flex}
.cc-box{width:min(560px,94vw);background:linear-gradient(160deg,rgba(26,36,64,.96),rgba(11,16,31,.97));
 border:1px solid rgba(77,163,255,.26);border-radius:22px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.8)}
.cc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cc-head b{font-size:14px}.cc-head span{font-size:11px;color:var(--ink3)}
.cc-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cc-act{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:12px;transition:all 220ms var(--ease)}
.cc-act:hover{border-color:var(--hi);background:rgba(0,112,193,.15)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#070a14}
::-webkit-scrollbar-thumb{background:rgba(100,135,200,.3);border-radius:9px}
@media(max-width:520px){.sysbar{padding:0 14px}.sysbar .net{display:none}.stage{padding-top:18px}.hints{gap:12px}.hint span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}


.b2048{width:min(400px,92vw);margin:0 auto;background:#bbada0;border-radius:14px;padding:10px;position:relative;touch-action:none;
display:grid;grid-template-columns:repeat(4,1fr)}
.gcell{aspect-ratio:1;padding:6px}
.gcell .inner{width:100%;height:100%;border-radius:8px;background:#cdc1b4;display:flex;align-items:center;justify-content:center;
font-weight:700;font-size:clamp(18px,6vw,30px);color:#776e65;transition:background .15s}
.b2048:after{display:none}
.v2{background:rgba(238,228,218,.90)!important;color:#776e65}.v4{background:rgba(237,224,200,.90)!important;color:#776e65}
.v8{background:#f2b179!important;color:#fff}.v16{background:#f59563!important;color:#fff}
.v32{background:#f67c5f!important;color:#fff}.v64{background:#f65e3b!important;color:#fff}
.v128{background:#edcf72!important;color:#fff;font-size:clamp(15px,5vw,26px)}
.v256{background:#edcc61!important;color:#fff;font-size:clamp(15px,5vw,26px)}
.v512{background:#edc850!important;color:#fff;font-size:clamp(15px,5vw,26px)}
.v1024{background:#edc53f!important;color:#fff;font-size:clamp(13px,4.5vw,22px)}
.v2048{background:#edc22e!important;color:#fff;font-size:clamp(13px,4.5vw,22px)}
.keys{color:var(--ink3);font-size:12px;text-align:center;margin-top:12px}
.key{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin:0 1px;background:rgba(255,255,255,.07)}

</style>
</head>
<body>
<div class="sysbar"><span class="ps"><svg viewBox="0 0 24 24"><path d="M6 3c6-1 10 1 10 5 0 3-2 4-5 5l5 8h-4l-4-7H9v7H6V3z" fill="currentColor"/></svg>PLAYSTATION WEB</span>
<span class="sp"></span><svg class="ic net" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8.5a15 15 0 0120 0M5 12a10 10 0 0114 0M8.5 15.5a5 5 0 017 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>
<span class="clock" id="sysclock">--:--</span><span class="me"><i class="dot"></i><span class="ava">Z</span>梓涵</span></div>
<header class="top">
<a class="home" href="../" title="主页"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9z"/></svg></a>
<a class="back" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>游戏库</a>
<span class="name">2048</span><span class="spacer"></span><span class="badge">益智</span>
<button class="psbtn" id="psbtn" title="控制中心"><svg viewBox="0 0 24 24"><path d="M6 3c6-1 10 1 10 5 0 3-2 4-5 5l5 8h-4l-4-7H9v7H6V3z"/></svg></button>
</header>
<main class="stage">
<div class="hud"><div class="cell"><div class="k">分数</div><div class="v" id="score">0</div></div><div class="cell"><div class="k">最高</div><div class="v" id="best">0</div></div></div>
<div class="panel" style="background:rgba(255,255,255,.07)"><div class="b2048" id="board"></div><div class="keys"><span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span> 或 <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> · 手机可直接滑动</div></div>
<div class="msg" id="msg"></div>
<div class="controls"><button class="btn" onclick="newGame()">新游戏</button><button class="btn sec" onclick="undo()">撤销一步</button></div>
<p class="tips">合并相同数字，凑出 2048。成绩自动保存在本机。</p>
</main>
<div class="overlay" id="ov" hidden><div class="box"><h2 id="ovt">游戏结束</h2><p id="ovp"></p><button class="btn" onclick="newGame();document.getElementById('ov').hidden=true">再来一局</button></div></div>
<div class="hints">
<div class="hint"><svg class="x" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg><span>确认</span></div>
<div class="hint"><svg class="o" viewBox="0 0 24 24" fill="none" stroke-width="2.6"><circle cx="12" cy="12" r="8.5"/></svg><span>返回</span></div>
<div class="hint"><svg class="t" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linejoin="round"><path d="M12 3l9 17H3z"/></svg><span>选项</span></div>
<div class="hint"><svg class="s" viewBox="0 0 24 24" fill="none" stroke-width="2.4"><rect x="4" y="4" width="16" height="16" rx="2"/></svg><span>主页</span></div>
</div>
<div class="cc" id="cc"><div class="cc-box"><div class="cc-head"><b>控制中心</b><span>PS / Esc 关闭</span></div>
<div class="cc-actions">
<button class="cc-act" onclick="location.href='../'">返回游戏库</button>
<button class="cc-act" onclick="location.reload()">重新开始</button>
<button class="cc-act" onclick="document.getElementById('cc').classList.remove('on')">继续游戏</button>
</div></div></div>
<script>

(function(){function tick(){var d=new Date(),e=document.getElementById('sysclock');
if(e)e.textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
tick();setInterval(tick,15000)})();
(function(){var cc=document.getElementById('cc'),b=document.getElementById('psbtn');
if(b)b.onclick=function(){cc.classList.toggle('on')};
cc.onclick=function(e){if(e.target===cc)cc.classList.remove('on')};
document.addEventListener('keydown',function(e){if(e.key==='Escape')cc.classList.remove('on');
 if(e.key==='p'||e.key==='P')cc.classList.toggle('on')})})();


function hiGet(k){try{return +(localStorage.getItem('gc_'+k)||0)}catch(e){return 0}}
function hiSet(k,v){try{localStorage.setItem('gc_'+k,v)}catch(e){}}
function setMsg(t){var m=document.getElementById('msg');if(m)m.textContent=t||''}


var S,score,best=hiGet('2048'),prev=null;
function empty(){return Array.from({length:4},()=>[0,0,0,0])}
function spawn(g){var f=[];for(var i=0;i<4;i++)for(var j=0;j<4;j++)if(!g[i][j])f.push([i,j]);
 if(!f.length)return;var c=f[Math.random()*f.length|0];g[c[0]][c[1]]=Math.random()<.9?2:4}
function clone(g){return g.map(function(r){return r.slice()})}
function lineMove(line){var a=line.filter(function(x){return x>0}),out=[],got=0;
 for(var i=0;i<a.length;i++){if(i+1<a.length&&a[i]===a[i+1]){out.push(a[i]*2);got+=a[i]*2;i++}else out.push(a[i])}
 while(out.length<4)out.push(0);return {v:out,gain:got}}
function move(dir){if(!S)return;var g=clone(S.grid),gain=0,changed=false;
 for(var k=0;k<4;k++){var idx=[0,1,2,3];if(dir==='left'||dir==='right'){var l=[];for(var i=0;i<4;i++)l.push(g[k][dir==='left'?i:3-i]);
  var r=lineMove(l),nv=[];for(var i=0;i<4;i++)nv[dir==='left'?i:3-i]=r.v[i];
  }else{var l2=[];for(var i=0;i<4;i++)l2.push(g[dir==='up'?i:3-i][k]);
   var r2=lineMove(l2);for(var i=0;i<4;i++)g[dir==='up'?i:3-i][k]=r2.v[i];gain+=r2.gain;continue}
  for(var i=0;i<4;i++)if(g[k][i]!==nv[i])changed=true;for(var i=0;i<4;i++)g[k][i]=nv[i];gain+=r.gain}
 if(!changed)return;prev={grid:clone(S.grid),score:score};S.grid=g;score+=gain;spawn(S.grid);draw();
 if(gain>0)setMsg('+'+gain);if(score>best){best=score;hiSet('2048',best)}
 document.getElementById('score').textContent=score;document.getElementById('best').textContent=best;
 if(!canMove()){document.getElementById('ovt').textContent='游戏结束';document.getElementById('ovp').textContent='最终得分 '+score;document.getElementById('ov').hidden=false}}
function canMove(){for(var i=0;i<4;i++)for(var j=0;j<4;j++){var v=S.grid[i][j];if(!v)return true;
 if(i<3&&S.grid[i+1][j]===v)return true;if(j<3&&S.grid[i][j+1]===v)return true}return false}
function draw(){var b=document.getElementById('board');b.innerHTML='';
 for(var i=0;i<16;i++){var c=document.createElement('div');c.className='gcell';
  var v=S.grid[i/4|0][i%4],inner=document.createElement('div');inner.className='inner'+(v?' v'+v:'');
  inner.textContent=v||'';c.appendChild(inner);b.appendChild(c)}}
function newGame(){S={grid:empty()};score=0;spawn(S.grid);spawn(S.grid);prev=null;setMsg('');
 document.getElementById('ov').hidden=true;document.getElementById('score').textContent=0;draw();document.getElementById('best').textContent=best}
function undo(){if(!prev)return setMsg('没有可撤销的步骤');S.grid=prev.grid;score=prev.score;prev=null;
 document.getElementById('score').textContent=score;setMsg('已撤销');draw()}
var KM={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down',A:'left',D:'right',W:'up',S:'down'};
document.addEventListener('keydown',function(e){if(KM[e.key]){e.preventDefault();move(KM[e.key])}});
var sx=0,sy=0;document.getElementById('board').addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.getElementById('board').addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');else move(dy>0?'down':'up')},{passive:true});
newGame();

</script>
</body>
</html>
