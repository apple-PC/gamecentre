<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>24点 · 课间游戏中心</title>
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{--accent:#ff9f0a}

:root{--bg:#f5f5f7;--paper:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#9a9a9e;
--line:rgba(0,0,0,.09);--accent:#0a84ff;--shadow:0 18px 50px -28px rgba(0,0,0,.28);--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.8);
backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:0 18px;height:52px;display:flex;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:14px;transition:color .2s}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}
.top .name{font-weight:650;font-size:16px;letter-spacing:-.2px}
.top .spacer{flex:1}
.top .badge{font-size:11px;color:var(--ink3);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.stage{max-width:640px;margin:0 auto;padding:22px 18px 60px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.hud{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.hud .cell{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 16px;text-align:center;min-width:86px}
.hud .cell .k{font-size:11px;color:var(--ink3);letter-spacing:.4px}
.hud .cell .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{border:none;background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.sec{background:#e8e8ed;color:var(--ink)}
.tips{margin-top:16px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.7}
.msg{text-align:center;font-size:15px;color:var(--ink2);margin:10px 0;min-height:22px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;z-index:40;padding:24px}
.overlay[hidden]{display:none}
.overlay .box{background:#fff;border-radius:22px;padding:30px 34px;text-align:center;max-width:340px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.overlay .box h2{font-size:24px;margin-bottom:8px}
.overlay .box p{color:var(--ink2);font-size:14px;margin-bottom:20px}
.hidden{display:none!important}


.nums{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 18px}
.num{background:#fff;border:1px solid var(--line);border-radius:14px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;
font-size:26px;font-weight:700;box-shadow:var(--shadow)}
.ans{display:block;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;font-size:18px;text-align:center;outline:none}
.ans:focus{border-color:var(--accent)}

</style>
</head>
<body>
<header class="top"><div class="top-in">
<a class="back" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>游戏中心</a>
<span class="name">24点</span><span class="spacer"></span><span class="badge">数学</span>
</div></header>
<main class="stage">
<div class="hud"><div class="cell"><div class="k">答对</div><div class="v" id="ok">0</div></div><div class="cell"><div class="k">连对</div><div class="v" id="streak">0</div></div></div>
<div class="panel"><div class="nums" id="nums"></div><input class="ans" id="ans" placeholder="输入算式，如 (1+2)*3*4" autocomplete="off"><div class="msg" id="hint" style="margin-top:12px"></div></div>
<div class="msg" id="msg"></div>
<div class="controls"><button class="btn" onclick="deal()">换一组</button><button class="btn sec" onclick="submit()">提交答案</button></div>
<p class="tips">用四个数字和 + - × ÷ 括号算出 24，每个数字用且仅用一次。输入 × 用 *，÷ 用 /。</p>
</main>

<script>

var nums=[],ok=0,streak=0;
function deal(){nums=[];for(var i=0;i<4;i++)nums.push(1+Math.random()*9|0);
 document.getElementById('nums').innerHTML=nums.map(function(n){return '<div class="num">'+n+'</div>'}).join('');
 document.getElementById('ans').value='';document.getElementById('hint').textContent='';setMsg('')}
function submit(){var s=document.getElementById('ans').value.trim().replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
 if(!s)return setMsg('先输入算式');
 var used=s.replace(/\d+/g,function(m){return m});var got=(s.match(/\d+/g)||[]).map(Number).sort(function(a,b){return a-b});
 var want=nums.slice().sort(function(a,b){return a-b});
 if(JSON.stringify(got)!==JSON.stringify(want))return setMsg('必须恰好用这四个数字各一次');
 var val;try{val=Function('"use strict";return ('+s+')')()}catch(e){return setMsg('算式无效')}
 if(Math.abs(val-24)<1e-6){ok++;streak++;document.getElementById('ok').textContent=ok;document.getElementById('streak').textContent=streak;
  setMsg('答对了！🎉');document.getElementById('hint').textContent=s+' = 24';setTimeout(deal,900)}
 else{streak=0;document.getElementById('streak').textContent=0;setMsg('结果是 '+(Math.round(val*100)/100)+'，不是 24')}}
document.getElementById('ans').addEventListener('keydown',function(e){if(e.key==='Enter')submit()});
deal();

</script>
</body>
</html>
