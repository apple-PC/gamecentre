<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>五子棋 · PlayStation web</title>
<meta name="theme-color" content="#0a0e1a">
<meta name="description" content="五子棋 — PlayStation web 游戏库，打开即玩，成绩自动保存在本机。">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{--accent:#ff9500}

:root{
  --bg:#08080a;--paper:rgba(24,25,30,.72);--ink:#f6f7fa;--ink2:rgba(255,255,255,.62);--ink3:rgba(255,255,255,.38);
  --line:rgba(255,255,255,.11);--accent:#0070d1;--accent-hi:#4da3ff;
  --shadow:0 26px 60px -26px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.06);
  --r:12px;--ease:cubic-bezier(.25,.1,.25,1)
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:radial-gradient(880px 520px at 78% -10%,rgba(0,112,209,.16),transparent 62%),
    radial-gradient(700px 420px at 8% 104%,rgba(0,80,160,.10),transparent 66%),
    linear-gradient(180deg,#0b0c10 0%,#08080a 58%,#060607 100%);
  background-attachment:fixed;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5;overflow-x:hidden
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:3px;border-radius:10px}
::selection{background:rgba(0,112,193,.55);color:#fff}
/* 系统状态栏 */
.sysbar{height:30px;padding:0 26px;display:flex;align-items:center;gap:11px;font-size:10.5px;
 letter-spacing:.9px;color:var(--ink2);background:rgba(6,6,8,.72);border-bottom:1px solid rgba(255,255,255,.07)}
.sysbar .ps{display:flex;align-items:center;gap:7px;font-weight:700;color:#e8f0ff}
.sysbar .ps svg{width:16px;height:16px}
.sysbar .sp{flex:1}
.sysbar .clock{font-variant-numeric:tabular-nums;color:#dbe6ff;letter-spacing:.5px}
.sysbar .me{display:flex;align-items:center;gap:6px;color:#e8f0ff}
.sysbar .me .dot{width:7px;height:7px;border-radius:50%;background:#4da3ff;box-shadow:0 0 9px #4da3ff}
.sysbar .ava{width:19px;height:19px;border-radius:50%;background:linear-gradient(135deg,#1684de,#004b94);display:grid;place-items:center;font-size:9px;font-weight:700}
.sysbar .ic{width:13px;height:13px;opacity:.8}
/* 顶栏 */
.top{position:sticky;top:0;z-index:30;height:62px;display:flex;align-items:center;gap:10px;padding:0 24px;
 background:rgba(10,10,13,.78);backdrop-filter:blur(30px) saturate(140%);-webkit-backdrop-filter:blur(30px) saturate(140%);
 border-bottom:1px solid rgba(255,255,255,.07)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent)}
.top .home{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);background:rgba(255,255,255,.05);transition:all 220ms var(--ease)}
.top .home:hover{color:#fff;background:rgba(0,112,193,.24)}
.top .home svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:12.5px;
 border:1px solid rgba(160,190,255,.16);border-radius:999px;padding:6px 13px;background:rgba(255,255,255,.035);
 transition:all 220ms var(--ease)}
.back:hover{color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.08)}
.back svg{width:15px;height:15px}
.top .name{font-weight:600;font-size:15px;letter-spacing:.2px}
.top .spacer{flex:1}
.top .badge{font-size:10.5px;color:#bcd6ff;border:1px solid rgba(0,112,193,.4);background:rgba(0,112,193,.14);padding:4px 11px;border-radius:999px}
.top .psbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
 background:linear-gradient(135deg,#1684de,#004b94);color:#fff;box-shadow:0 0 20px rgba(0,112,193,.5)}
.top .psbtn svg{width:17px;height:17px;fill:#fff}
/* 舞台与玻璃面板 */
.stage{max-width:680px;margin:0 auto;padding:26px 18px 110px}
.panel{background:linear-gradient(160deg,rgba(27,28,34,.72),rgba(13,13,16,.8));border:1px solid rgba(255,255,255,.08);
 border-radius:12px;box-shadow:0 24px 64px -26px rgba(0,0,0,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:20px}
.hud{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.hud .cell{background:rgba(14,20,38,.64);border:1px solid var(--line);border-radius:14px;padding:8px 16px;text-align:center;min-width:86px;backdrop-filter:blur(12px)}
.hud .cell .k{font-size:11px;color:var(--ink3);letter-spacing:.6px}
.hud .cell .v{font-size:20px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 18px rgba(255,255,255,.16)}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.btn{border:1px solid rgba(255,255,255,.2);border-radius:999px;background:linear-gradient(180deg,#1684de,#0064b4);color:#fff;
 padding:11px 22px;font-size:14px;font-weight:600;box-shadow:0 8px 22px -8px rgba(0,112,193,.85),inset 0 1px 0 rgba(255,255,255,.22);
 transition:transform 220ms var(--ease),box-shadow 220ms var(--ease),filter 220ms var(--ease)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.sec{background:rgba(255,255,255,.075);color:#e6edff;border-color:rgba(160,190,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.btn.sec:hover{background:rgba(255,255,255,.13);box-shadow:none}
.tips{margin-top:18px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.75}
.msg{text-align:center;font-size:14px;color:#bcd6ff;margin:10px 0;min-height:22px}
.overlay{position:fixed;inset:0;background:rgba(3,5,12,.76);backdrop-filter:blur(12px);
 display:flex;align-items:center;justify-content:center;z-index:60;padding:24px}
.overlay[hidden]{display:none}
.overlay .box{background:linear-gradient(155deg,rgba(28,29,35,.96),rgba(12,13,17,.97));border:1px solid rgba(255,255,255,.13);
 border-radius:22px;padding:32px 34px;text-align:center;max-width:340px;width:100%;box-shadow:0 30px 90px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.08)}
.overlay .box h2{font-size:24px;font-weight:650;margin-bottom:8px}
.overlay .box p{color:var(--ink2);font-size:14px;margin-bottom:22px}
.hidden{display:none!important}
/* PS5 手柄按键提示条 */
.hints{position:fixed;left:0;right:0;bottom:30px;z-index:35;height:54px;display:flex;align-items:center;justify-content:center;gap:30px;
 background:linear-gradient(180deg,transparent,rgba(4,7,16,.92) 42%);font-size:11.5px;color:var(--ink2)}
.hint{display:flex;align-items:center;gap:7px}
.hint svg{width:17px;height:17px}
.hint .x{stroke:#2f9bff}.hint .o{stroke:#e8455d}.hint .t{stroke:#37c98b}.hint .s{stroke:#c878dd}
/* 控制中心 */
.cc{position:fixed;inset:0;z-index:70;background:rgba(3,5,12,.6);backdrop-filter:blur(16px);
 display:none;align-items:flex-end;justify-content:center;padding:0 0 64px}
.cc.on{display:flex}
.cc-box{width:min(560px,94vw);background:linear-gradient(160deg,rgba(26,36,64,.96),rgba(11,16,31,.97));
 border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.8)}
.cc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cc-head b{font-size:14px}.cc-head span{font-size:11px;color:var(--ink3)}
.cc-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cc-act{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:12px;transition:all 220ms var(--ease)}
.cc-act:hover{border-color:var(--hi);background:rgba(0,112,193,.15)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(100,135,200,.3);border-radius:9px}
@media(max-width:520px){.sysbar{padding:0 14px}.sysbar .net{display:none}.stage{padding-top:18px}.hints{gap:12px}.hint span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}


/* 爱发电：底部说明条 */
.afd-bar{position:fixed;left:0;right:0;bottom:0;z-index:46;height:30px;display:flex;align-items:center;justify-content:center;
 gap:6px;padding:0 14px;background:rgba(6,10,20,.97);border-top:1px solid rgba(255,138,61,.22);
 font-size:11px;color:#c3cee4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
 transition:color 220ms var(--ease),border-color 220ms var(--ease)}
.afd-bar:hover{color:#ffd0ab;border-color:rgba(255,138,61,.5)}
.afd-bar b{color:#ff9d57;font-weight:600}
.afd-bar .afd-heart{color:#ff7a3d;font-size:12px;line-height:1}
.afd-bar .afd-arrow{color:#ff9d57;font-size:11px;opacity:.8}
@media(max-width:520px){.afd-bar{font-size:10px;gap:5px}.afd-bar .afd-arrow{display:none}}
/* 爱发电：首次弹窗 */
.afd-modal{position:fixed;inset:0;z-index:92;background:rgba(3,5,12,.64);backdrop-filter:blur(10px);
 display:none;align-items:center;justify-content:center;padding:20px}
.afd-modal.on{display:flex;animation:afdIn 260ms var(--ease)}
@keyframes afdIn{from{opacity:0}to{opacity:1}}
.afd-card{width:min(400px,92vw);background:linear-gradient(160deg,#2b1709,#150b05 72%);
 border:1px solid rgba(255,138,61,.34);border-radius:22px;padding:26px 24px 20px;position:relative;
 box-shadow:0 30px 90px rgba(0,0,0,.78);text-align:center;animation:afdUp 300ms var(--ease)}
@keyframes afdUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.afd-badge{display:inline-block;font-size:11px;letter-spacing:.04em;color:#ffb27a;
 border:1px solid rgba(255,138,61,.4);background:rgba(255,138,61,.12);padding:4px 12px;border-radius:999px;margin-bottom:14px}
.afd-card h3{font-size:19px;font-weight:650;color:#fff4ec;margin-bottom:10px}
.afd-card p{font-size:13px;line-height:1.7;color:#c9b3a4;margin-bottom:20px}
.afd-go{display:block;background:linear-gradient(135deg,#ff9a4d,#ff6a1a);color:#241004;font-weight:650;
 font-size:13.5px;padding:12px;border-radius:12px;transition:transform 220ms var(--ease),filter 220ms var(--ease)}
.afd-go:hover{transform:translateY(-1px);filter:brightness(1.06)}
.afd-later{display:inline-block;background:none;border:none;color:#8b7a6e;font-size:12px;margin-top:12px;
 cursor:pointer;font-family:inherit;padding:4px 8px}
.afd-later:hover{color:#c9b3a4}
.afd-close{position:absolute;top:10px;right:13px;background:none;border:none;color:#9c8878;font-size:22px;
 line-height:1;cursor:pointer;padding:2px 4px}
.afd-close:hover{color:#ffb27a}


.gm{background:#e8c98f;border-radius:12px;position:relative;width:min(390px,92vw);aspect-ratio:1;margin:0 auto;
box-shadow:inset 0 0 30px rgba(0,0,0,.1)}
.gm canvas{width:100%;height:100%;display:block;cursor:crosshair}

</style>
</head>
<body>
<div class="sysbar"><span class="ps"><svg viewBox="0 0 24 24"><path d="M6 3c6-1 10 1 10 5 0 3-2 4-5 5l5 8h-4l-4-7H9v7H6V3z" fill="currentColor"/></svg>PLAYSTATION WEB</span>
<span class="sp"></span><svg class="ic net" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8.5a15 15 0 0120 0M5 12a10 10 0 0114 0M8.5 15.5a5 5 0 017 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>
<span class="clock" id="sysclock">--:--</span><span class="me"><i class="dot"></i><span class="ava">Z</span>梓涵</span></div>
<header class="top">
<a class="home" href="../" title="主页"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9z"/></svg></a>
<a class="back" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>游戏库</a>
<span class="name">五子棋</span><span class="spacer"></span><span class="badge">对战</span>
<button class="psbtn" id="psbtn" title="控制中心"><svg viewBox="0 0 24 24"><path d="M6 3c6-1 10 1 10 5 0 3-2 4-5 5l5 8h-4l-4-7H9v7H6V3z"/></svg></button>
</header>
<main class="stage">
<div class="hud"><div class="cell"><div class="k">对手</div><div class="v" style="font-size:15px">电脑 AI</div></div><div class="cell"><div class="k">你执</div><div class="v" style="font-size:15px">黑 ●</div></div></div>
<div class="panel"><div class="gm"><canvas id="cv" width="390" height="390"></canvas></div></div>
<div class="msg" id="msg"></div>
<div class="controls"><button class="btn" onclick="start()">重新开局</button></div>
<p class="tips">点击交叉点落子，先连成五子者胜。你执黑先手，AI 执白。</p>
</main>
<div class="overlay" id="ov" hidden><div class="box"><h2 id="ovt"></h2><p id="ovp"></p><button class="btn" onclick="start();document.getElementById('ov').hidden=true">再来一局</button></div></div>
<div class="hints">
<div class="hint"><svg class="x" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg><span>确认</span></div>
<div class="hint"><svg class="o" viewBox="0 0 24 24" fill="none" stroke-width="2.6"><circle cx="12" cy="12" r="8.5"/></svg><span>返回</span></div>
<div class="hint"><svg class="t" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linejoin="round"><path d="M12 3l9 17H3z"/></svg><span>选项</span></div>
<div class="hint"><svg class="s" viewBox="0 0 24 24" fill="none" stroke-width="2.4"><rect x="4" y="4" width="16" height="16" rx="2"/></svg><span>主页</span></div>
</div>
<div class="cc" id="cc"><div class="cc-box"><div class="cc-head"><b>控制中心</b><span>PS / Esc 关闭</span></div>
<div class="cc-actions">
<button class="cc-act" onclick="location.href='../'">返回游戏库</button>
<button class="cc-act" onclick="location.reload()">重新开始</button>
<button class="cc-act" onclick="document.getElementById('cc').classList.remove('on')">继续游戏</button>
</div></div></div>
<div class="afd-bar" id="afdBar" role="complementary" aria-label="赞助支持">
<span class="afd-heart">&#9829;</span><span>本站为个人作品，喜欢的话可以在 <b>爱发电</b> 支持我</span><span class="afd-arrow">&#8594;</span>
</div>
<div class="afd-modal" id="afdModal" role="dialog" aria-modal="true" aria-labelledby="afdTitle">
 <div class="afd-card">
  <button class="afd-close" id="afdClose" aria-label="关闭">&#215;</button>
  <div class="afd-badge">&#9749; 爱发电</div>
  <h3 id="afdTitle">喜欢这个网站吗？</h3>
  <p>PlayStation web 是我业余时间做的小项目，完全免费、没有广告。如果它让你玩得开心，欢迎请我喝杯咖啡。</p>
  <a class="afd-go" href="https://afdian.com/a/apple-pc" target="_blank" rel="noopener">前往爱发电支持 &#8594;</a>
  <button class="afd-later" id="afdLater">以后再说</button>
 </div>
</div>
<script>

(function(){function tick(){var d=new Date(),e=document.getElementById('sysclock');
if(e)e.textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
tick();setInterval(tick,15000)})();
(function(){var cc=document.getElementById('cc'),b=document.getElementById('psbtn');
if(b)b.onclick=function(){cc.classList.toggle('on')};
cc.onclick=function(e){if(e.target===cc)cc.classList.remove('on')};
document.addEventListener('keydown',function(e){if(e.key==='Escape')cc.classList.remove('on');
 if(e.key==='p'||e.key==='P')cc.classList.toggle('on')})})();


function hiGet(k){try{return +(localStorage.getItem('gc_'+k)||0)}catch(e){return 0}}
function hiSet(k,v){try{localStorage.setItem('gc_'+k,v)}catch(e){}}
function setMsg(t){var m=document.getElementById('msg');if(m)m.textContent=t||''}


(function(){var M=document.getElementById('afdModal'),B=document.getElementById('afdBar');
if(!M)return;
var KEY='afd_dismissed';
function close(){M.classList.remove('on');try{localStorage.setItem(KEY,'1')}catch(e){}}
function open(){M.classList.add('on')}
var c=document.getElementById('afdClose'),l=document.getElementById('afdLater');
if(c)c.onclick=close;if(l)l.onclick=close;
M.onclick=function(e){if(e.target===M)close()};
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&M.classList.contains('on'))close()});
if(B)B.onclick=function(){window.open('https://afdian.com/a/apple-pc','_blank','noopener')};
var seen=false;try{seen=localStorage.getItem(KEY)==='1'}catch(e){}
if(!seen)setTimeout(open,1200);
})();


var N=13,cv=document.getElementById('cv'),ctx=cv.getContext('2d'),cell=cv.width/(N+1),b,turn,over;
function start(){b=Array.from({length:N},()=>Array(N).fill(0));turn=1;over=false;document.getElementById('ov').hidden=true;setMsg('你先手');draw()}
function draw(){ctx.fillStyle='#e8c98f';ctx.fillRect(0,0,cv.width,cv.height);
 ctx.strokeStyle='#7a5a2e';ctx.lineWidth=1;for(var i=0;i<N;i++){ctx.beginPath();ctx.moveTo(cell,(i+1)*cell);ctx.lineTo(N*cell,(i+1)*cell);ctx.stroke();
 ctx.beginPath();ctx.moveTo((i+1)*cell,cell);ctx.lineTo((i+1)*cell,N*cell);ctx.stroke()}
 for(var i=0;i<N;i++)for(var j=0;j<N;j++)if(b[i][j]){var x=(j+1)*cell,y=(i+1)*cell;
 ctx.beginPath();ctx.arc(x,y,cell*.42,0,7);ctx.fillStyle=b[i][j]===1?'#1a1a1a':'#fff';ctx.fill();
 ctx.strokeStyle='rgba(0,0,0,.3)';ctx.stroke()}}
function place(i,j,p){b[i][j]=p;draw();if(check(i,j,p)){over=true;document.getElementById('ovt').textContent=p===1?'你赢了！':'AI 赢了';
 document.getElementById('ovp').textContent='五子连珠';document.getElementById('ov').hidden=false;return true}return false}
function check(i,j,p){var D=[[0,1],[1,0],[1,1],[1,-1]];return D.some(function(d){var c=1;
 for(var s=-1;s<=1;s+=2){var x=i+d[0]*s,y=j+d[1]*s;while(x>=0&&x<N&&y>=0&&y<N&&b[x][y]===p){c++;x+=d[0]*s;y+=d[1]*s}}
 return c>=5})}
cv.onclick=function(e){if(over||turn!==1)return;var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*cv.width,y=(e.clientY-r.top)/r.height*cv.height;
 var j=Math.round(x/cell)-1,i=Math.round(y/cell)-1;if(i<0||i>=N||j<0||j>=N||b[i][j])return;
 if(place(i,j,1))return;turn=2;setMsg('AI 思考中…');setTimeout(ai,300)};
function ai(){var best=-1,bi=-1,bj=-1;
 for(var i=0;i<N;i++)for(var j=0;j<N;j++){if(b[i][j])continue;var s=score(i,j,2)+score(i,j,1)*.9;
  if(s>best){best=s;bi=i;bj=j}}
 if(bi>=0){if(!place(bi,bj,2))turn=1;setMsg('轮到你了')}}
function score(i,j,p){var total=0,D=[[0,1],[1,0],[1,1],[1,-1]];
 D.forEach(function(d){var c=0,open=0;
  for(var s=-1;s<=1;s+=2){var x=i+d[0]*s,y=j+d[1]*s,k=0;while(x>=0&&x<N&&y>=0&&y<N&&b[x][y]===p){k++;x+=d[0]*s;y+=d[1]*s}
   c+=k;if(x>=0&&x<N&&y>=0&&y<N&&!b[x][y])open++}
  if(c>0)total+=Math.pow(10,c)+open*c});return total}
start();

</script>
</body>
</html>
